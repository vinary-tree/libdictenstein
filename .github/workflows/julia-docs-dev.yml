---
name: Deploy Julia development documentation

# Development guide only. This workflow does not register or publish packages.
"on":
  push:
    branches: [master]
    paths:
      - ".github/workflows/julia-docs-dev.yml"
      - "bindings/julia/Libdictenstein/**"
      - "bindings/api.json"
      - "src/ffi/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: julia-docs-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and read back Julia development docs
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      # yamllint disable-line rule:line-length
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with: {version: "1.10"}
      - name: Build the native library used by the documented examples
        run: >-
          cargo build --locked --release --no-default-features
          --features julia-bindings
      - name: Build and deploy strict Julia documentation
        env:
          LIBDICTENSTEIN_LIBRARY: >-
            ${{ github.workspace }}/target/release/liblibdictenstein.so
          LIBDICTENSTEIN_DOCS_DEPLOY: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=bindings/julia/Libdictenstein/docs -e '
            using Pkg
            root = ENV["GITHUB_WORKSPACE"]
            Pkg.develop([
              Pkg.PackageSpec(path=joinpath(
                root, "..", "vinary-tree-interop", "bindings", "julia",
                "VinaryTreeInterop",
              )),
              Pkg.PackageSpec(path=joinpath(
                root, "bindings", "julia", "Libdictenstein",
              )),
            ])
            Pkg.instantiate()
            include("bindings/julia/Libdictenstein/docs/make.jl")
          '
      - name: Verify deployed gh-pages tree
        run: |
          git fetch --depth=1 origin gh-pages
          scratch="$PWD/target/julia-docs-readback"
          mkdir -p "$scratch"
          git show FETCH_HEAD:dev/index.html > "$scratch/deployed.html"
          grep -Fq 'High-performance dictionaries' "$scratch/deployed.html"
      - name: Verify public Pages URL
        run: |
          scratch="$PWD/target/julia-docs-readback"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location \
              https://vinary-tree.github.io/libdictenstein/dev/ \
              -o "$scratch/public.html" && \
              grep -Fq 'High-performance dictionaries' \
                "$scratch/public.html"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Public Julia development docs were not readable' >&2
          exit 1
