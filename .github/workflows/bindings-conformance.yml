name: Bindings conformance

# Runs each language facade's uniform C1-C10 conformance suite against a live
# libdictenstein cdylib. Every suite is self-contained: it replays the canonical
# cross-language fixture (bindings/canonical_fixture.json) and never needs a
# liblevenshtein transducer, so it pins the *producer* ABI in isolation.
#
# A single `native` job builds the release cdylib once and publishes it as an
# artifact; each language job downloads it into target/release and runs its
# facade's suite with the toolchain-appropriate command. The dev-siblings action
# provides the vinary-tree-interop sources/headers that several facades compile
# against.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  javascript:
    name: JavaScript, TypeScript, and ClojureScript revision-8 gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with: { cli: 1.12.5.1664 }
      - name: Install pinned TypeScript without resolving unpublished RC.6 packages
        shell: bash
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/target/ci-typescript" \
            --ignore-scripts --no-package-lock --no-audit --no-fund \
            --save-exact typescript@6.0.3
          echo "$GITHUB_WORKSPACE/target/ci-typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run executable host-language gates
        working-directory: bindings/javascript
        run: |
          npm test
          npm run test:typescript
          npm run test:cljs

  native:
    name: Build cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the producer ABI cdylib
        run: cargo build --release --no-default-features --features ffi,pathmap-backend
      - uses: actions/upload-artifact@v7
        with:
          name: libdictenstein-so
          path: target/release/liblibdictenstein.so
          if-no-files-found: error

  python:
    name: Python (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - run: python -m pip install pytest
      - name: Run the conformance suite
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          export PYTHONPATH="$GITHUB_WORKSPACE/bindings/python/src:$parent/vinary-tree-interop/bindings/python/src"
          export LIBDICTENSTEIN_LIBRARY="$GITHUB_WORKSPACE/target/release/liblibdictenstein.so"
          python -m pytest -q bindings/python/tests/test_conformance.py bindings/python/tests/test_backends.py
      - name: Gate Python optional backends against revision 7
        run: |
          cc -std=c11 -shared -fPIC tests/fixtures/revision7_probe.c \
            -o target/revision7-probe.so
          parent="$(dirname "$GITHUB_WORKSPACE")"
          export PYTHONPATH="$GITHUB_WORKSPACE/bindings/python/src:$parent/vinary-tree-interop/bindings/python/src"
          LIBDICTENSTEIN_LIBRARY="$GITHUB_WORKSPACE/target/revision7-probe.so" \
            python -m pytest -q bindings/python/tests/test_revision7_gate.py

  julia:
    name: Julia collections and algebra
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      # yamllint disable-line rule:line-length
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with: { version: "1.10" }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Verify generated Julia ABI declarations
        run: |
          python3 scripts/generate-julia-abi.py --check
          python3 scripts/generate-julia-abi.py --self-test
      - name: Run package conformance and strict API documentation
        env:
          LIBDICTENSTEIN_LIBRARY: ${{ github.workspace }}/target/release/liblibdictenstein.so
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          mkdir -p target/julia-ci-env
          julia --project=target/julia-ci-env -e '
            using Pkg
            root = ENV["GITHUB_WORKSPACE"]
            Pkg.develop([
              Pkg.PackageSpec(path=joinpath(
                root, "..", "vinary-tree-interop", "bindings", "julia",
                "VinaryTreeInterop",
              )),
              Pkg.PackageSpec(path=joinpath(
                root, "bindings", "julia", "Libdictenstein",
              )),
            ])
            Pkg.test("Libdictenstein")
          '
          julia --project=bindings/julia/Libdictenstein/docs -e '
            using Pkg
            root = ENV["GITHUB_WORKSPACE"]
            Pkg.develop([
              Pkg.PackageSpec(path=joinpath(
                root, "..", "vinary-tree-interop", "bindings", "julia",
                "VinaryTreeInterop",
              )),
              Pkg.PackageSpec(path=joinpath(
                root, "bindings", "julia", "Libdictenstein",
              )),
            ])
            Pkg.instantiate()
            include("bindings/julia/Libdictenstein/docs/make.jl")
          '
      - name: Gate new Julia symbols against revision 7
        run: |
          cc -std=c11 -shared -fPIC tests/fixtures/revision7_probe.c \
            -o target/revision7-probe.so
          LIBDICTENSTEIN_LIBRARY="$GITHUB_WORKSPACE/target/revision7-probe.so" \
            julia --project=target/julia-ci-env \
              bindings/julia/Libdictenstein/test/revision7_gate.jl

  raku:
    name: Raku collections and algebra
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - name: Verify generated Raku ABI declarations and omissions
        run: |
          python3 scripts/generate-raku-abi.py --check
          python3 scripts/generate-raku-abi.py --self-test
      # yamllint disable-line rule:line-length
      - uses: Raku/setup-raku@b8b1a4ebe85ef112edfc65e9edc8c57735367e3f  # v1
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Run NativeCall layout, collection, persistence, and algebra tests
        env:
          LIBDICTENSTEIN_LIBRARY: ${{ github.workspace }}/target/release/liblibdictenstein.so
        run: >-
          raku -Ibindings/raku/lib
          -I../vinary-tree-interop/bindings/raku/lib
          bindings/raku/t/01-conformance.rakutest
      - name: Gate Raku PathMap against revision 7
        run: |
          mkdir -p target
          cc -std=c11 -shared -fPIC tests/fixtures/revision7_probe.c \
            -o target/revision7-probe.so
          LIBDICTENSTEIN_LIBRARY="$GITHUB_WORKSPACE/target/revision7-probe.so" \
            raku -Ibindings/raku/lib \
              -I../vinary-tree-interop/bindings/raku/lib \
              bindings/raku/t/02-revision7-gate.rakutest

  go:
    name: Go (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/setup-go@v6
        with: { go-version: "stable", cache: false }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Run conformance and public-package profile smoke tests
        working-directory: bindings/go
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          go mod edit \
            "-replace=github.com/vinary-tree/liblevenshtein-rust/bindings/go/v4=$parent/liblevenshtein-rust/bindings/go"
          go mod edit \
            "-replace=github.com/vinary-tree/vinary-tree-interop/bindings/go/v4=$parent/vinary-tree-interop/bindings/go"
          CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release" \
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release" \
            GOWORK=off go test ./conformance/ ./cmd/collection-traversal-profile/

  ruby:
    name: Ruby (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.4" }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - run: gem install minitest -v 6.0.6
      - name: Generate and check the packaged Ruby API documentation
        working-directory: bindings/ruby
        run: |
          ruby -c lib/vinary_tree/libdictenstein.rb
          ruby -c lib/vinary_tree/libdictenstein/native.rb
          ruby -c lib/vinary_tree/libdictenstein/version.rb
          rdoc --coverage-report \
            lib/vinary_tree/libdictenstein.rb \
            lib/vinary_tree/libdictenstein/native.rb \
            lib/vinary_tree/libdictenstein/version.rb \
            | tee ../../target/ruby-rdoc-coverage.log
          grep -Fq '100% documentation!' ../../target/ruby-rdoc-coverage.log
          rdoc --quiet --op ../../target/ruby-rdoc --main README.md \
            README.md \
            lib/vinary_tree/libdictenstein.rb \
            lib/vinary_tree/libdictenstein/native.rb \
            lib/vinary_tree/libdictenstein/version.rb
          test -s ../../target/ruby-rdoc/index.html
          test -s ../../target/ruby-rdoc/VinaryTree/Libdictenstein/Dictionary.html
          test -s ../../target/ruby-rdoc/VinaryTree/Libdictenstein/EntryStream.html
          test -s ../../target/ruby-rdoc/VinaryTree/Libdictenstein/PathMap.html
          grep -Fq 'id="method-i-algebra"' \
            ../../target/ruby-rdoc/VinaryTree/Libdictenstein/Dictionary.html
          grep -Fq 'id="method-i-next"' \
            ../../target/ruby-rdoc/VinaryTree/Libdictenstein/EntryStream.html
          gem build libdictenstein.gemspec --strict \
            --output ../../target/libdictenstein-ruby-doc-check.gem
          ruby -rrubygems/package -e '
            package = Gem::Package.new(ARGV.fetch(0))
            spec = package.spec
            expected = "https://www.rubydoc.info/gems/#{spec.name}/#{spec.version}"
            abort "unexpected documentation URI" unless spec.metadata["documentation_uri"] == expected
            abort "README is missing from gem" unless package.contents.include?("README.md")
          ' ../../target/libdictenstein-ruby-doc-check.gem
      - name: Run conformance and public-package profile smoke tests
        working-directory: bindings/ruby
        run: |
          export LIBDICTENSTEIN_LIBRARY="$GITHUB_WORKSPACE/target/release/liblibdictenstein.so"
          ruby -Ilib -Itest test/test_conformance.rb
          ruby -Ilib -Itest test/test_collection_profile.rb
          ruby -c bin/libdictenstein-collection-profile
      - name: Gate Ruby optional backends against revision 7
        run: |
          cc -std=c11 -shared -fPIC tests/fixtures/revision7_probe.c \
            -o target/revision7-probe.so
          LIBDICTENSTEIN_LIBRARY="$GITHUB_WORKSPACE/target/revision7-probe.so" \
            ruby -Ibindings/ruby/lib bindings/ruby/test/test_revision7_gate.rb

  c:
    name: C entry cursor
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Compile conformance and public-package profile smoke tests
        run: |
          rel="$GITHUB_WORKSPACE/target/release"
          cc -std=c17 -Wall -Wextra -Werror -I include \
            tests/fixtures/revision8_header_layout.c \
            -o target/revision8-header-layout
          target/revision8-header-layout
          cc -std=c17 -Wall -Wextra -Werror \
            tests/fixtures/revision7_consumer.c \
            -L "$rel" -llibdictenstein -o target/revision7-consumer
          LD_LIBRARY_PATH="$rel" target/revision7-consumer
          cc -std=c17 -O2 -Wall -Wextra -Werror bindings/c/tests/entries.c \
            -I include -L "$rel" -llibdictenstein -o /tmp/c_entries
          LD_LIBRARY_PATH="$rel" /tmp/c_entries
          cc -std=c17 -O2 -Wall -Wextra -Werror \
            bindings/c/examples/collection_traversal_profile.c \
            -I include -L "$rel" -llibdictenstein \
            -o /tmp/c_collection_profile
          LD_LIBRARY_PATH="$rel" /tmp/c_collection_profile \
            --arm stream-cancel --entries 16 --batch-size 4 --early-cancel 5
          LD_LIBRARY_PATH="$rel" /tmp/c_collection_profile \
            --arm reduce --entries 16 --batch-size 4

  cpp:
    name: C++ (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Compile conformance and public-header profile smoke tests
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rel="$GITHUB_WORKSPACE/target/release"
          c++ -std=c++20 -O2 -Wall -Wextra bindings/cpp/tests/conformance.cpp \
            -I include -I "$parent/vinary-tree-interop/include" \
            -L "$rel" -llibdictenstein -o /tmp/cpp_conformance
          LD_LIBRARY_PATH="$rel" /tmp/cpp_conformance bindings/canonical_fixture.json
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            bindings/cpp/examples/collection_traversal_profile.cpp \
            -I include -L "$rel" -llibdictenstein \
            -o /tmp/cpp_collection_profile
          LD_LIBRARY_PATH="$rel" /tmp/cpp_collection_profile \
            --arm stream-cancel --entries 16 --batch-size 4 --early-cancel 5

  lua:
    name: Lua (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev
      - name: Build the C module and run the conformance suite
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rel="$GITHUB_WORKSPACE/target/release"
          mkdir -p /tmp/luacpath/vinary_tree
          cc -shared -fPIC -O2 -std=c11 -I/usr/include/lua5.4 \
            -I include -I bindings/lua/include \
            -I "$parent/vinary-tree-interop/include" \
            bindings/lua/src/libdictenstein_lua.c \
            -L "$rel" -llibdictenstein -o /tmp/luacpath/vinary_tree/libdictenstein.so
          LUA_CPATH="/tmp/luacpath/?.so" LD_LIBRARY_PATH="$rel" \
            lua5.4 bindings/lua/test/conformance.lua bindings/canonical_fixture.json

  ocaml:
    name: OCaml (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.2" }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Install deps and run the conformance suite
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rel="$GITHUB_WORKSPACE/target/release"
          opam pin add --yes --no-action vinary-tree-interop "$parent/vinary-tree-interop/bindings/ocaml"
          opam install --yes vinary-tree-interop yojson
          cd bindings/ocaml
          eval "$(opam env)"
          LIBRARY_PATH="$rel" LD_LIBRARY_PATH="$rel" \
            dune exec ./test/conformance.exe -- "$GITHUB_WORKSPACE/bindings/canonical_fixture.json"

  haskell:
    name: Haskell (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: haskell-actions/setup@v2
        with: { ghc-version: "9.12.2", cabal-version: latest }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Build and run the conformance test-suite
        run: |
          rel="$GITHUB_WORKSPACE/target/release"
          mkdir -p /tmp/hs-pc
          {
            echo "prefix=$GITHUB_WORKSPACE"
            echo 'libdir=${prefix}/target/release'
            echo 'includedir=${prefix}/include'
            echo
            echo "Name: libdictenstein"
            echo "Description: High-performance dictionaries and trie-maps for approximate string matching"
            echo "Version: 4.0.0-rc.6"
            echo 'Libs: -L${libdir} -llibdictenstein'
            echo 'Cflags: -I${includedir}'
          } > /tmp/hs-pc/libdictenstein.pc
          cd bindings/haskell
          export PKG_CONFIG_PATH=/tmp/hs-pc
          export LIBRARY_PATH="$rel"
          export LD_LIBRARY_PATH="$rel"
          test "$(pkg-config --modversion libdictenstein)" = "4.0.0-rc.6"
          cabal test --project-file=cabal.project conformance \
              --extra-lib-dirs="$rel" \
              --extra-include-dirs="$GITHUB_WORKSPACE/include" \
              --test-show-details=direct \
              --test-options="$GITHUB_WORKSPACE/bindings/canonical_fixture.json"

  swift:
    name: Swift (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - name: Report the GitHub runner Swift toolchain
        run: swift --version
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Run conformance and compile the public-package profile
        env:
          VINARY_TREE_INTEROP_ROOT: ${{ github.workspace }}/../vinary-tree-interop
        run: |
          rel="$GITHUB_WORKSPACE/target/release"
          test -f "$rel/liblibdictenstein.so"
          # SwiftPM does not reliably forward LIBRARY_PATH to ld.gold on hosted Linux.
          LD_LIBRARY_PATH="$rel" \
            swift build --package-path bindings/swift/libdictenstein \
              --product libdictenstein-collection-profile -Xlinker "-L$rel"
          LD_LIBRARY_PATH="$rel" \
            LDICT_FIXTURE="$GITHUB_WORKSPACE/bindings/canonical_fixture.json" \
            swift test --package-path bindings/swift/libdictenstein \
              -Xlinker "-L$rel"
          LD_LIBRARY_PATH="$rel" \
            swift run --package-path bindings/swift/libdictenstein --skip-build \
              libdictenstein-collection-profile --arm stream-cancel \
              --entries 16 --batch-size 4 --early-cancel 5

  dotnet:
    name: .NET (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.x" }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Run the conformance runner
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rel="$GITHUB_WORKSPACE/target/release"
          LD_LIBRARY_PATH="$rel" dotnet run -c Release \
            --project bindings/dotnet/tests/VinaryTree.Libdictenstein.Conformance \
            -p:VinaryTreeInteropRoot="$parent/vinary-tree-interop" \
            -- "$GITHUB_WORKSPACE/bindings/canonical_fixture.json"

  jvm:
    name: JVM (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Compile the facade and run the JUnit suite
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rel="$GITHUB_WORKSPACE/target/release"
          interop_src="$parent/vinary-tree-interop/bindings/jvm/src/main/java"
          mkdir -p /tmp/jvm-classes
          javac -d /tmp/jvm-classes $(find "$interop_src" -name '*.java')
          javac -d /tmp/jvm-classes -cp /tmp/jvm-classes \
            $(find bindings/jvm/src/main/java -name '*.java')
          curl -fsSL -o /tmp/junit.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          javac -d /tmp/jvm-classes -cp /tmp/jvm-classes:/tmp/junit.jar \
            bindings/jvm/src/test/java/io/vinarytree/libdictenstein/ConformanceTest.java
          java --enable-native-access=ALL-UNNAMED -Djava.library.path="$rel" \
            -DvinaryTree.fixture="$GITHUB_WORKSPACE/bindings/canonical_fixture.json" \
            -jar /tmp/junit.jar --class-path /tmp/jvm-classes \
            --select-class io.vinarytree.libdictenstein.ConformanceTest \
            --disable-banner --details=summary --fail-if-no-tests

  clojure:
    name: Clojure (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with: { cli: latest }
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Compile the JVM facade and run conformance and profile smokes
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rel="$GITHUB_WORKSPACE/target/release"
          interop_src="$parent/vinary-tree-interop/bindings/jvm/src/main/java"
          interop_out="$parent/vinary-tree-interop/bindings/jvm/build/classes/java/main"
          mkdir -p "$interop_out"
          javac -d "$interop_out" $(find "$interop_src" -name '*.java')
          mkdir -p bindings/jvm/build/classes/java/main
          javac -d bindings/jvm/build/classes/java/main -cp "$interop_out" \
            $(find bindings/jvm/src/main/java -name '*.java')
          cd bindings/clojure
          clojure -J-Djava.library.path="$rel" -M:conformance
          clojure -J-Djava.library.path="$rel" -M:profile \
            --arm stream-cancel --entries 16 --batch-size 4 --early-cancel 5 \
            --passes 1 --warmup-passes 0
          clojure -J-Djava.library.path="$rel" -M:profile \
            --arm reduce --entries 16 --batch-size 4 \
            --passes 1 --warmup-passes 0

  fortran:
    name: Fortran (C1-C10)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: fortran-lang/setup-fpm@v10
      - uses: actions/download-artifact@v7
        with: { name: libdictenstein-so, path: target/release }
      - name: Run the fpm conformance test
        working-directory: bindings/fortran
        run: |
          rel="$GITHUB_WORKSPACE/target/release"
          LIBRARY_PATH="$rel" LD_LIBRARY_PATH="$rel" fpm test --link-flag "-L$rel"
