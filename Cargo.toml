[package]
name = "libdictenstein"
version = "0.2.1"
edition = "2021"
# Effective floor across `--all-features`: pathmap 0.2.2 and sysinfo 0.39 are the
# binding constraints. The previously declared 1.70 was inaccurate — bincode 2.0.1
# and lru 0.18 already required 1.85, and pathmap 0.2.2 required 1.88.
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/libdictenstein"
description = "High-performance dictionary data structures (trie, DAWG, double-array trie, suffix automaton, lock-free durable persistent ART) behind one trait API; pairs with liblevenshtein for fuzzy matching"
keywords = ["trie", "dawg", "dictionary", "fuzzy-search", "automata"]
categories = ["algorithms", "data-structures", "text-processing"]
readme = "README.md"
exclude = ["docs/", "formal-verification/"]

[dependencies]
# Stable retained-resource ABI shared with independently packaged Vinary Tree
# consumers. The path is development-only; crates.io publication resolves the
# exact version requirement.
vinary-tree-interop = { path = "../liblevenshtein-rust/vinary-tree-interop", version = "0.1.0", optional = true }
# Logging facade
log = "0.4"
# SmallVec for stack-allocated vectors (performance optimization)
smallvec = { version = "1.15", features = ["serde"] }
# Fast non-cryptographic hashing for internal use.
# 2.0 replaced the original Firefox-derived fxhash with a different algorithm, so
# identical inputs now hash to different values. That is safe here only because no
# FxHash output is ever persisted: `DawgCore::suffix_cache` and
# `DawgCore::bloom_filter` are both `serde(skip)`, and the on-disk ARTrie format
# uses xxhash-rust/xxh3 for node dedup. See the note in src/bloom_filter.rs.
rustc-hash = "2.1"
# Lock-free atomic Arc swapping for DynamicDawgU64
arc-swap = "1.9"
# Error handling
thiserror = "2.0"
# Shared lattice trait (join/meet); extracted leaf crate (cycle-break)
llattice = { path = "../llattice", version = "0.1" }
# Faster RwLock for DynamicDawg
parking_lot = { version = "0.12", optional = true }
# Serialization support (optional)
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
# `bincode-next`, declared under the name `bincode` so the shim in
# `serialization::bincode_compat` needs no edit.
#
# The original `bincode` is unmaintained (RUSTSEC-2025-0141): the crate was
# abandoned after a doxxing/harassment incident, the repository was archived
# 2025-08-15, and its 3.0.0 is a *tombstone* shipping only a README plus a
# `lib.rs` containing a single compiler error to announce that status. There is
# no fixed version to upgrade to, so the advisory can only be closed by leaving
# the crate. `bincode-next` is the maintained fork and keeps the same API.
#
# Byte compatibility was measured, not assumed: a probe crate depending on
# bincode 1.3, bincode 2.0 and bincode-next 3 simultaneously produced identical
# `config::legacy()` output for scalars, signed integers, sequences, nested
# structs ([u8;8] + u32 + String + Option<Vec<u8>> + i64) and payload-carrying
# enums. The `wire_format_pins` tests in bincode_compat.rs enforce that going
# forward — the fixint-LE layout is load-bearing for the persistent ARTrie
# counter leaf and for the raw-offset magic/version reads in the snapshot
# formats. See docs/algorithms/serialization.md.
bincode = { package = "bincode-next", version = "3", features = ["serde"], optional = true }

# Compression support (optional)
flate2 = { version = "1.1", optional = true }

# Protobuf support (optional)
prost = { version = "0.14", optional = true }

# PathMap as an optional dictionary backend
pathmap = { version = ">=0.2.2, <0.4", optional = true }

# Memory-mapped I/O for persistent data structures.
# Floor is 0.9.11: 0.9.10 and earlier carry RUSTSEC-2026-0186 (unchecked pointer
# offset), and this crate is the mmap backend under the whole persistent ARTrie.
memmap2 = { version = "0.9.11", optional = true }

# Lock-free MPMC channels for group commit
crossbeam-channel = { version = "0.5", optional = true }

# Cross-platform system information (memory, CPU, etc.)
sysinfo = { version = "0.39", optional = true }

# Parallel processing for merge operations.
# Floor is 1.12 so the resolved crossbeam-epoch is >= 0.9.20 (RUSTSEC-2026-0204,
# invalid pointer dereference in the `fmt::Pointer` impl for `Atomic`/`Shared`).
rayon = { version = "1.12", optional = true }

# Fast non-cryptographic hashing for node deduplication
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

# LRU cache for reverse lookups in vocabulary trie
lru = { version = "0.18", optional = true }

# Concurrent hash map for LRU tracking in eviction
dashmap = { version = "6.2", optional = true }

# (Removed) `im` was the RRB-tree backing for the lock-free overlay nodes; both
# the char and byte overlay nodes now use the tiered `ChildStore` (Inline/Heap)
# with owned `Child` slots, so `im` has no remaining users. Re-add here if a
# future module needs persistent vectors again.

# io_uring for O_DIRECT async I/O (Linux-only, optional)
io-uring = { version = "0.7", optional = true }

# libc for O_DIRECT flag and fallocate (Linux-only, used by io-uring-backend)
libc = { version = "0.2", optional = true }
# Safe syscall wrappers — used for `flock` advisory file locking (Tier-1 single-owner lock).
# Already present transitively; the `fs` feature adds `rustix::fs::flock` with no new `unsafe`.
rustix = { version = "1", features = ["fs"], optional = true }

[build-dependencies]
prost-build = { version = "0.14", optional = true }
# prost-build shells out to a `protoc` binary and vendors none of its own, so
# without this the `protobuf` feature builds only on hosts that happen to have
# protoc installed. This crate ships prebuilt binaries; build.rs prefers an
# explicit `PROTOC` override and falls back to it. See docs/engineering/feature-flags.md.
protoc-bin-vendored = { version = "3.2", optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27"
proptest = "1.11"
# For macro test name concatenation. `paste` itself is unmaintained and archived
# (RUSTSEC-2024-0436); `pastey` is the maintained drop-in successor and exports the
# same `paste!` macro. Renamed back to `paste` here so the `paste::paste!` call
# sites in tests/common/macros.rs need no edit.
paste = { package = "pastey", version = "0.2" }
hdrhistogram = "7.5"  # High dynamic range histograms for latency benchmarks
# PRNG for randomized benchmark scenarios. 0.9 rather than 0.10: proptest 1.11
# already pulls rand 0.9, so 0.9 collapses the otherwise-duplicated
# rand/rand_core/rand_chacha/getrandom pairs to a single copy each. 0.9.3 is the
# floor for RUSTSEC-2026-0097 (unsoundness with a custom logger using `rand::rng()`).
rand = "0.9.3"
loom = "0.7"  # Bounded schedule exploration for concurrency correspondence tests

[features]
default = ["parking_lot"]
bindings-core = ["dep:vinary-tree-interop"]
# The stable project ABI includes the persistent constructors and checkpoint
# operations. Keep the symbol set invariant for every FFI build; consumers can
# select in-memory backends at runtime without producing an ABI-fragmented
# shared library.
ffi = ["bindings-core", "persistent-artrie"]
native-bindings-full = ["ffi"]
c-bindings = ["native-bindings-full"]
cpp-bindings = ["native-bindings-full"]
python-bindings = ["native-bindings-full"]
jvm-bindings = ["native-bindings-full"]
clojure-bindings = ["jvm-bindings"]
javascript-bindings = ["bindings-core"]
typescript-bindings = ["javascript-bindings"]
clojurescript-bindings = ["javascript-bindings"]
dotnet-bindings = ["native-bindings-full"]
go-bindings = ["native-bindings-full"]
swift-bindings = ["native-bindings-full"]
ruby-bindings = ["native-bindings-full"]
fortran-bindings = ["native-bindings-full"]
ocaml-bindings = ["native-bindings-full"]
haskell-bindings = ["native-bindings-full"]
lua-bindings = ["native-bindings-full"]
pathmap-backend = ["pathmap"]
serialization = ["serde", "bincode"]
compression = ["flate2"]
protobuf = ["prost", "prost-build", "dep:protoc-bin-vendored"]
# Persistent Adaptive Radix Trie (disk-based dictionary).
# Enables the `serialization` feature transitively because the
# persistent_artrie* modules use `crate::serialization::bincode_compat`
# unconditionally — without this dep the module references resolve to a
# feature-gated crate::serialization that isn't visible.
persistent-artrie = ["memmap2", "parking_lot", "serde", "bincode", "sysinfo", "xxhash-rust", "lru", "dashmap", "crossbeam-channel", "serialization", "dep:rustix"]
# Group commit for WAL batching.
# Status: EXPERIMENTAL — measured 1.5-2x throughput regression on NVMe vs
# per-record sync in benches/group_commit_benchmarks.rs (recorded 2026-01-15).
# Retained for slower-storage scenarios (HDDs, remote block stores) and for
# revisiting under a different coordinator design. Do not enable on NVMe
# without re-benchmarking. See docs/persistence/group_commit_regression.md.
group-commit = ["persistent-artrie", "crossbeam-channel"]
# Parallel merge using rayon for multi-core acceleration
parallel-merge = ["persistent-artrie", "rayon"]
# io_uring-based block storage backend (Linux-only, requires kernel >= 5.1)
io-uring-backend = ["persistent-artrie", "dep:io-uring", "dep:libc"]
# Expose internal APIs for benchmarks (not in default features)
bench-internals = ["io-uring-backend"]
# Causal work counters for profiling builds; never enable for timing runs.
perf-instrumentation = []
# Same-binary runtime controls for paired optimization experiments. Unlike
# perf-instrumentation, this feature does not execute work counters or retain
# diagnostic sets, so timing profiles remain representative of production.
benchmark-controls = []

[lib]
name = "libdictenstein"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(part_legacy_edge_store)"] }

