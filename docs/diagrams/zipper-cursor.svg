<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="725px" preserveAspectRatio="none" style="width:1189px;height:725px;background:#FFFFFF;" version="1.1" viewBox="0 0 1189 725" width="1189px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="38"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="697.8467" x="242.304" y="22.9951">Dual-cursor advance &#8212; intersection synchronizes L and R, emits only where BOTH agree</text></g><g class="entity" data-qualified-name="Aligned" data-source-line="42" id="ent0001"><rect fill="#C8E6C9" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="269.0469" x="774.45" y="220.9569"/><line style="stroke:#37474F;stroke-width:0.5;" x1="774.45" x2="1043.4969" y1="279.8475" y2="279.8475"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="52.6162" x="784.45" y="238.952">Aligned</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="199.9512" x="784.45" y="255.2489">L and R sit at the SAME path</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="249.0469" x="784.45" y="271.5457">(both Some &#8212; operands still agree)</text></g><g class="entity" data-qualified-name="TestEmit" data-source-line="44" id="ent0002"><rect fill="#FFF59D" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="308.2715" x="213.84" y="381.8569"/><line style="stroke:#37474F;stroke-width:0.5;" x1="213.84" x2="522.1115" y1="440.7475" y2="440.7475"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="61.8105" x="223.84" y="399.852">TestEmit</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="243.5986" x="223.84" y="416.1489">evaluate the combinator predicate</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="288.2715" x="223.84" y="432.4457">INTERSECTION: L.is_final() &amp;&amp; R.is_final()</text></g><g class="entity" data-qualified-name="Emit" data-source-line="46" id="ent0003"><rect fill="#BBDEFB" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="309.9531" x="7" y="551.1269"/><line style="stroke:#37474F;stroke-width:0.5;" x1="7" x2="316.9531" y1="610.0175" y2="610.0175"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="31.8623" x="17" y="569.122">Emit</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="225.3125" x="17" y="585.4189">yield (path, zipper) to consumer</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="289.9531" x="17" y="601.7157">value = strategy.merge(L.value, R.value)</text></g><g class="entity" data-qualified-name="Descend" data-source-line="48" id="ent0004"><rect fill="#FFF59D" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="246.4336" x="220.76" y="51.6869"/><line style="stroke:#37474F;stroke-width:0.5;" x1="220.76" x2="467.1936" y1="110.5775" y2="110.5775"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="60.7578" x="230.76" y="69.682">Descend</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="226.4336" x="230.76" y="85.9789">label &#8712; children(L) &#8745; children(R)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="225.374" x="230.76" y="102.2757">descend(label) on BOTH cursors</text></g><g class="entity" data-qualified-name="Ascend" data-source-line="50" id="ent0005"><rect fill="#FFF59D" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="251.5537" x="727.2" y="381.8569"/><line style="stroke:#37474F;stroke-width:0.5;" x1="727.2" x2="978.7537" y1="440.7475" y2="440.7475"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="111.7607" x="737.2" y="399.852">Sibling / Ascend</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="231.5537" x="737.2" y="416.1489">pop DFS frame &#183; advance to next</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="181.7061" x="737.2" y="432.4457">shared child of the parent</text></g><g class="entity" data-qualified-name="Prune" data-source-line="52" id="ent0006"><rect fill="#ECEFF1" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="232.0234" x="506.96" y="220.9569"/><line style="stroke:#37474F;stroke-width:0.5;" x1="506.96" x2="738.9834" y1="279.8475" y2="279.8475"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="40.5576" x="516.96" y="238.952">Prune</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="183.0049" x="516.96" y="255.2489">L or R cannot take label &#8594;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="212.0234" x="516.96" y="271.5457">subtree cannot intersect: SKIP</text></g><g class="entity" data-qualified-name="Done" data-source-line="54" id="ent0007"><rect fill="#ECEFF1" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="195.458" x="755.25" y="551.1269"/><line style="stroke:#37474F;stroke-width:0.5;" x1="755.25" x2="950.708" y1="610.0175" y2="610.0175"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="73.7393" x="765.25" y="569.122">Exhausted</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="137.1494" x="765.25" y="585.4189">DFS stack empty &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="175.458" x="765.25" y="601.7157">no more aligned children</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="40" id="ent0008"><ellipse cx="908.98" cy="86.1269" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="70" id="ent0020"><ellipse cx="852.98" cy="700.4069" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="852.98" cy="700.4069" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN22" data-source-line="73" id="ent0023"><path d="M502.04,43.2969 L502.04,82.1269 L467.43,86.1269 L502.04,90.1269 L502.04,128.9609 A0,0 0 0 0 502.04,128.9609 L861.9033,128.9609 A0,0 0 0 0 861.9033,128.9609 L861.9033,53.2969 L851.9033,43.2969 L502.04,43.2969 A0,0 0 0 0 502.04,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M851.9033,43.2969 L851.9033,53.2969 L861.9033,53.2969 L851.9033,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="293.249" x="508.04" y="60.3638">LOCKSTEP rule: a label is followed only if it is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="317.6304" x="508.04" y="75.4966">present in BOTH cursors' children (set &#8745;). UNION</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="331.5317" x="508.04" y="90.6294">follows a label present in EITHER (set &#8746;) and never</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="338.8633" x="508.04" y="105.7622">takes the Prune edge &#8212; it keeps a cursor as `None`</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="229.3281" x="508.04" y="120.895">where that operand lacks the path.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="81" id="ent0026"><path d="M352.23,542.7469 L352.23,581.5769 L317.2,585.5769 L352.23,589.5769 L352.23,628.4109 A0,0 0 0 0 352.23,628.4109 L719.7232,628.4109 A0,0 0 0 0 719.7232,628.4109 L719.7232,552.7469 L709.7232,542.7469 L352.23,542.7469 A0,0 0 0 0 352.23,542.7469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M709.7232,542.7469 L709.7232,552.7469 L719.7232,552.7469 L709.7232,542.7469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="323.5972" x="358.23" y="559.8138">Only the EMIT predicate changes per combinator;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="334.5342" x="358.23" y="574.9466">the descend / ascend / sibling machinery is shared.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="344.5762" x="358.23" y="590.0794">DIFFERENCE follows LEFT's children (right tags along</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="342.0942" x="358.23" y="605.2122">for the exclusion test); INTERSECTION &amp; VALUE-DIFF</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="346.4932" x="358.23" y="620.345">follow the &#8745;; UNION &amp; SYM-DIFFERENCE follow the &#8746;.</text></g><!--link *start* to Aligned--><g class="link" data-entity-1="ent0008" data-entity-2="ent0001" data-link-type="dependency" data-source-line="40" id="lnk9"><path d="M908.98,96.6069 C908.98,120.0369 908.98,1