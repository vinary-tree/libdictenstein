<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="871px" preserveAspectRatio="none" style="width:646px;height:871px;background:#FFFFFF;" version="1.1" viewBox="0 0 646 871" width="646px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="22"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="357.4785" x="57.1292" y="32.9951">insert_recursive("cat") &#8212; build the new spine</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="83.0293" x="419.4817" y="32.9951">bottom-up</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="80.3223" x="507.385" y="32.9951">(leaf first)</text></g><ellipse cx="205.4185" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#ECEFF1" height="140.8906" style="stroke:#000000;stroke-width:1.5;" width="320.2871" x="45.2749" y="82.2969"/><path d="M249.4019,82.2969 L249.4019,91.5938 L239.4019,101.5938 L45.2749,101.5938" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="194.127" x="48.2749" y="96.292">Descend (grey = plumbing)</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="300.2871" x="55.2749" y="118.5938"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="280.2871" x="65.2749" y="141.5889">insert_recursive(node, "cat", depth = 0)</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="155.7686" x="127.5342" y="174.8906"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="135.7686" x="137.5342" y="197.8857">depth 0 &#8594; key = 'c'</text><rect fill="#BBDEFB" height="173.0391" style="stroke:#000000;stroke-width:1.5;" width="329.5225" x="98.1997" y="233.1875"/><path d="M312.895,233.1875 L312.895,242.4844 L302.895,252.4844 L98.1997,252.4844" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="204.6953" x="101.1997" y="247.1826">Branch test (blue = decision)</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="174.4375" x="118.1997" y="319.6328"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="154.4375" x="128.1997" y="342.6279">recurse into that child</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="99.6611" x="128.1997" y="358.9248">(depth + 1) &#8230;</text><polygon fill="#F1F1F1" points="122.5054,269.4844,288.3315,269.4844,300.3315,281.4844,288.3315,293.4844,122.5054,293.4844,110.5054,281.4844,122.5054,269.4844" style="stroke:#37474F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="24.1924" x="209.4185" y="306.4795">yes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="165.8262" x="122.5054" y="286.3311">node has a child for 'c'?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="122.3906" x="300.3315" y="278.1826">no &#8212; new branch</text><rect fill="#C8E6C9" height="282.375" style="stroke:#000000;stroke-width:1.5;" width="610.8364" x="16" y="416.2266"/><path d="M419.3262,416.2266 L419.3262,425.5234 L409.3262,435.5234 L16,435.5234" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="393.3262" x="19" y="430.2217">create_path('at') &#8212; allocate the tail BOTTOM-UP (green)</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="241.2998" x="84.7686" y="452.5234"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="29.832" x="94.7686" y="475.5186">leaf</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="176.1689" x="129.0508" y="475.5186">(empty) &#8212; created FIRST</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="221.2998" x="94.7686" y="491.8154">(will be marked FINAL for "cat")</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="239.6592" x="85.5889" y="525.1172"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="219.6592" x="95.5889" y="548.1123">wrap with 't'  &#8594;  node  't' &#8594; leaf</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="358.8369" x="26" y="581.4141"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="233.6455" x="36" y="604.4092">wrap with 'a'  &#8594;  node  'a' &#8594; 't'  =</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="100.7412" x="274.0957" y="604.4092">subtree_root</text><path d="M326.6919,627.7109 L326.6919,653.1563 L306.6919,657.1563 L326.6919,661.1563 L326.6919,686.6016 A0,0 0 0 0 326.6919,686.6016 L616.8364,686.6016 A0,0 0 0 0 616.8364,686.6016 L616.8364,637.7109 L606.8364,627.7109 L326.6919,627.7109 A0,0 0 0 0 326.6919,627.7109" fill="#FFF9C4" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M606.8364,627.7109 L606.8364,637.7109 L616.8364,637.7109 L606.8364,627.7109" fill="#FFF9C4" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="195.9795" x="332.6919" y="645.7061">Bottom-up = leaf &#8594; 't' &#8594; 'a'.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="226.9395" x="332.6919" y="662.0029">Every node is immutable, so the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="269.1445" x="332.6919" y="678.2998">wrap allocates a NEW node each step.</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="202.5469" x="104.145" y="639.0078"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="182.5469" x="114.145" y="662.0029">return (subtree_root, leaf)</text><rect fill="#ECEFF1" height="100.8906" style="stroke:#000000;stroke-width:1.5;" width="373.2725" x="18.7822" y="708.6016"/><path d="M223.2305,708.6016 L223.2305,717.8984 L213.2305,727.8984 L18.7822,727.8984" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="194.4482" x="21.7822" y="722.5967">Return the new node (grey)</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="353.2725" x="28.7822" y="744.8984"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="285.708" x="38.7822" y="767.8936">return  node.with_child('c', subtree_root)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="333.2725" x="38.7822" y="784.1904">&#8212; a NEW immutable root, ready to CAS-publish</text><ellipse cx="205.4185" cy="840.4922" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="205.4185" cy="840.4922" fil