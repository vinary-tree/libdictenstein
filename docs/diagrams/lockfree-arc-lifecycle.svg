<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="770px" preserveAspectRatio="none" style="width:690px;height:770px;background:#FFFFFF;" version="1.1" viewBox="0 0 690 770" width="690px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="25"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="547.8389" x="70.2776" y="32.9951">Arc lifecycle across one CAS attempt  (pre-Phase-A raw-pointer path)</text></g><ellipse cx="325.8413" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#ECEFF1" height="117.1875" style="stroke:#000000;stroke-width:1.5;" width="273.5361" x="189.0732" y="83.0986"/><path d="M448.9473,83.0986 L448.9473,92.3955 L438.9473,102.3955 L189.0732,102.3955" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="249.874" x="192.0732" y="97.0938">1 &#183; Load from AtomicNodePtr (grey)</text><rect fill="#F1F1F1" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="253.5361" x="199.0732" y="119.3955"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="227.5205" x="209.0732" y="142.3906">Arc::increment_strong_count</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="233.5361" x="209.0732" y="158.6875">bump refcount BEFORE returning</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="178.6025" x="209.0732" y="174.9844">&#8594; prevents use-after-free</text><rect fill="#FFE0B2" height="157.1875" style="stroke:#000000;stroke-width:1.5;" width="336.4834" x="157.5996" y="211.0879"/><path d="M484.083,211.0879 L484.083,220.3848 L474.083,230.3848 L157.5996,230.3848" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="316.4834" x="160.5996" y="225.083">2 &#183; Build the new tree (amber = raw handoff)</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="295.3994" x="178.1416" y="247.3848"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="275.3994" x="188.1416" y="270.3799">Arc::new &#8212; allocate new node versions</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="246.8027" x="202.4399" y="303.6816"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="104.5967" x="212.4399" y="326.6768">Arc::into_raw</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="117.7559" x="321.4868" y="326.6768">&#8212; store as a raw</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="222.4824" x="212.4399" y="342.9736">pointer inside SwizzledPtr (u64)</text><polygon fill="#F1F1F1" points="226.1357,388.2754,425.5469,388.2754,437.5469,400.2754,425.5469,412.2754,226.1357,412.2754,214.1357,400.2754,226.1357,388.2754" style="stroke:#37474F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="199.4111" x="226.1357" y="405.1221">CAS(root: old &#8594; new) result?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="125.002" x="89.1338" y="396.9736">fail &#8212; root moved</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="115.2061" x="437.5469" y="396.9736">win &#8212; published</text><rect fill="#FFE0B2" height="100.8906" style="stroke:#000000;stroke-width:1.5;" width="318.7832" x="16" y="422.2754"/><path d="M282.0537,422.2754 L282.0537,431.5723 L272.0537,441.5723 L16,441.5723" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="256.0537" x="19" y="436.2705">3 &#183; Reclaim the rejected Arc (amber)</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="298.7832" x="26" y="458.5723"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="110.7217" x="36" y="481.5674">Arc::from_raw</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="163.6113" x="151.1719" y="481.5674">&#8212; take ownership back</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="214.0811" x="36" y="497.8643">and drop it (else it would leak)</text><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="243.0156" x="354.7832" y="422.2754"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="223.0156" x="364.7832" y="445.2705">new version is now the live root</text><polygon fill="#F1F1F1" points="325.8413,529.166,337.8413,541.166,325.8413,553.166,313.8413,541.166,325.8413,529.166" style="stroke:#37474F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#C8E6C9" height="100.8906" style="stroke:#000000;stroke-width:1.5;" width="296.4434" x="177.6196" y="563.166"/><path d="M437.1997,563.166 L437.1997,572.4629 L427.1997,582.4629 L177.6196,582.4629" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="249.5801" x="180.6196" y="577.1611">4 &#183; Old version unreachable (green)</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="276.4434" x="187.6196" y="599.4629"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="129.165" x="197.6196" y="622.458">Arc refcount &#8594; 0</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="86.9805" x="331.2349" y="622.458">&#8594; automatic</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="256.4434" x="197.6196" y="638.7549">deallocation of the superseded node</text><path d="M356.8413,674.0566 L356.8413,707.6504 L336.8413,711.6504 L356.8413,715.6504 L356.8413,749.2441 A0,0 0 0 0 356.8413,749.2441 L669.394,749.2441 A0,0 0 0 0 669.394,749.2441 L669.394,684.0566 L659.394,674.0566 L356.8413,674.0566 A0,0 0 0 0 356.8413,674.0566" fill="#FFF9C4" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M659.394,674.0566 L659.394,684.0566 L669.394,684.0566 L659.394,674.0566" fill="#FFF9C4" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="261.7959" x="362.8413" y="692.0518">Phase A removed into_raw/from_raw:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="291.5527" x="362.8413" y="708.3486">children are an owned Child::InMem(Arc),</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="258.6855" x="362.8413" y="724.6455">so steps 2-3 are ordinary Arc moves;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="146.3301" x="362.8413" y="740.9424">step 4 is unchanged.</text><ellipse cx="325.8413" cy="711.6504" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="325.8413" cy="711.6504" fill="#222222" rx="6" r