ualified-name="GMN11" data-source-line="39" id="ent0012"><path d="M6,622.9769 L6,708.6409 L322.1343,708.6409 L322.1343,632.9769 L312.1343,622.9769 L6,622.9769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M312.1343,622.9769 L312.1343,632.9769 L322.1343,632.9769 L312.1343,622.9769" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="267.9917" x="12" y="640.0438">Fast read path: once in Memory the child</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="264.2974" x="12" y="655.1766">pointer is followed with native speed; no</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="295.1343" x="12" y="670.3094">buffer-manager lookup. Eviction reverses the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="271.4321" x="12" y="685.4422">cycle to reclaim RAM, leaving the durable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="142.8477" x="12" y="700.575">disk encoding behind.</text></g><!--link *start* to Disk--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="31" id="lnk6"><path d="M377.07,63.6769 C377.07,79.8969 377.07,108.9669 377.07,134.9369" fill="none" id="*start*-to-Disk" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="377.07,139.9369,381.07,130.9369,377.07,134.9369,373.07,130.9369,377.07,139.9369" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="209.0093" x="378.07" y="106.3638">on_disk(block_id, location, type)</text></g><!--link Disk to Install--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-