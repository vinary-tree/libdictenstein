<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="723px" preserveAspectRatio="none" style="width:674px;height:723px;background:#FFFFFF;" version="1.1" viewBox="0 0 674 723" width="674px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="24"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="476.4443" x="95.7756" y="22.9951">SwizzledPtr swizzle lifecycle (atomic CAS on the state word)</text></g><g class="entity" data-qualified-name="Disk" data-source-line="26" id="ent0001"><rect fill="#BBDEFB" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="207.3115" x="273.5" y="140.2969"/><line style="stroke:#37474F;stroke-width:0.5;" x1="273.5" x2="480.8115" y1="199.1875" y2="199.1875"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="101.9854" x="283.5" y="158.292">Disk reference</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="60.1084" x="283.5" y="174.5889">MSB = 0</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="187.3115" x="283.5" y="190.8857">block_id + location + flags</text></g><g class="entity" data-qualified-name="Install" data-source-line="27" id="ent0002"><rect fill="#FFF59D" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="251.9502" x="153" y="301.2969"/><line style="stroke:#37474F;stroke-width:0.5;" x1="153" x2="404.9502" y1="360.1875" y2="360.1875"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="63.793" x="163" y="319.292">Installing</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="139.7266" x="163" y="335.5889">state = (1&lt;&lt;63) | 1</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="231.9502" x="163" y="351.8857">thread owns memory_ptr publish</text></g><g class="entity" data-qualified-name="Mem" data-source-line="28" id="ent0003"><rect fill="#C8E6C9" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="195.376" x="130.5" y="462.2969"/><line style="stroke:#37474F;stroke-width:0.5;" x1="130.5" x2="325.876" y1="521.1875" y2="521.1875"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="56.9365" x="140.5" y="480.292">Memory</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="106.2783" x="140.5" y="496.5889">state = 1&lt;&lt;63</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="175.376" x="140.5" y="512.8857">memory_ptr -&gt; live node</text></g><g class="entity" data-qualified-name="Evict" data-source-line="29" id="ent0004"><rect fill="#FFF59D" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="235.8926" x="357" y="631.7969"/><line style="stroke:#37474F;stroke-width:0.5;" x1="357" x2="592.8926" y1="690.6875" y2="690.6875"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="55.8564" x="367" y="649.792">Evicting</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="139.7266" x="367" y="666.0889">state = (1&lt;&lt;63) | 2</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="215.8926" x="367" y="682.3857">thread owns memory_ptr clear</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="31" id="ent0005"><ellipse cx="377" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="39" id="ent0012"><path d="M6,623.2969 L6,708.9609 L322.1343,708.9609 L322.1343,633.2969 L312.1343,623.2969 L6,623.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M312.1343,623.2969 L312.1343,633.2969 L322.1343,633.2969 L312.1343,623.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="267.9917" x="12" y="640.3638">Fast read path: once in Memory the child</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="264.2974" x="12" y="655.4966">pointer is followed with native speed; no</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="295.1343" x="12" y="670.6294">buffer-manager lookup. Eviction reverses the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="271.4321" x="12" y="685.7622">cycle to reclaim RAM, leaving the durable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="142.8477" x="12" y="700.895">disk encoding behind.</text></g><!--link *start* to Disk--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="31" id="lnk6"><path d="M377,63.6769 C377,79.9569 377,109.2169 377,135.2269" fill="none" id="*start*-to-Disk" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="377,140.2269,381,131.2269,377,135.2269,373,131.2269,377,140.2269" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="209.0093" x="378" y="106.3638">on_disk(block_id, location, type)</text></g><!--link Disk to Install--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="33" id="lnk7"><path d="M339.79,209.60