<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="527px" preserveAspectRatio="none" style="width:984px;height:527px;background:#FFFFFF;" version="1.1" viewBox="0 0 984 527" width="984px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="9"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="285.5029" x="257.9149" y="22.9951">Persistent ARTrie family &#8212; lock-free</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="60.6553" x="548.2918" y="22.9951">durable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="105.4717" x="613.8211" y="22.9951">overlay stack</text></g><!--entity Client--><g class="entity" data-qualified-name="Client" data-source-line="11" id="ent0001"><rect fill="#BBDEFB" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="446.0977" x="524.11" y="259.5069"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="77.2051" x="534.11" y="282.502">Client API</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="350.9023" x="534.11" y="298.7989">PersistentARTrie &#183; &#8230;Char &#183; &#8230;U64Compact &#183; Vocab</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="426.0977" x="534.11" y="315.0957">insert_with_value &#183; upsert &#183; sequence insert &#183; get &#183; iter_prefix</text></g><!--entity Overlay--><g class="entity" data-qualified-name="Overlay" data-source-line="13" id="ent0002"><rect fill="#FFE0B2" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="383.624" x="249.34" y="428.5469"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="137.334" x="259.34" y="451.542">Lock-free overlay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="170.7686" x="405.5744" y="451.542">(the live representation)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="322.1025" x="259.34" y="467.8389">atomic root &#183; immutable adaptive edge stores</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="197.9756" x="259.34" y="484.1357">ByteKey &#183; CharKey &#183; U64Key</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="363.624" x="259.34" y="500.4326">path compression &#183; copy-on-write structural sharing</text></g><!--entity Dur--><g class="entity" data-qualified-name="Dur" data-source-line="15" id="ent0003"><rect fill="#FFCDD2" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="371.668" x="191.32" y="66.2369"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="245.6426" x="201.32" y="89.232">Durability &#8212; log before publish</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="351.668" x="201.32" y="105.5289">&#9312; append + fsync WAL record   &#9313; publish via CAS</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="319.2725" x="201.32" y="121.8257">&#9314; commit rank / watermark where applicable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="342.1318" x="201.32" y="138.1226">checkpoint lock serializes checkpoint publication</text></g><!--entity Store--><g class="entity" data-qualified-name="Store" data-source-line="17" id="ent0004"><rect fill="#CFD8DC" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="364.3125" x="7" y="251.3569"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="153.8291" x="17" y="274.352">Checkpoint storage</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="344.3125" x="17" y="290.6489">mmap (default)  |  io_uring + O_DIRECT (feature)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="334.3184" x="17" y="306.9457">CX/dense overlay images &#183; retained WAL replay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="199.4385" x="17" y="323.2426">u64 compact prefix-4 profile</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="25" id="ent0010"><path d="M597.7,43.2969 L597.7,104.8269 L563.16,108.8269 L597.7,112.8269 L597.7,174.3594 A0,0 0 0 0 597.7,174.3594 L900.6121,174.3594 A0,0 0 0 0 900.6121,174.3594 L900.6121,53.2969 L890.6121,43.2969 L597.7,43.2969 A0,0 0 0 0 597.7,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M890.6121,43.2969 L890.6121,53.2969 L900.6121,53.2969 L890.6121,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="189.3379" x="603.7" y="60.3638">acknowledged &#10233; durable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="250.3198" x="603.7" y="75.4966">a write becomes visible only AFTER its</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="186.729" x="603.7" y="90.6294">WAL record is fsync-durable.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="250.9292" x="603.7" y="105.7622">Linearization point = the winning CAS.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="249.209" x="603.7" y="120.895">For byte/char/vocab, the watermark is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="281.9121" x="603.7" y="136.0278">the safe checkpoint LSN under out-of-order</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="114.2515" x="603.7" y="151.1606">lock-free commit.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="199.418" x="603.7" y="166.2935">(TLA+ checked: no lost writes)</text></g><!--link Client to Overlay--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="19" id="lnk5"><path d="M688.16,328.7369 C638.66,357.0669 572.0694,395.1929 518.9094,425.6229" fill="none" id="Client-to-Overlay" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="514.57,428.1069,524.368,427.1073,518.9094,425.6229,520.3937,420.1643,514.57,428.1069" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="74.8896" x="622.56" y="387.1138">read / write</text></g><!--link Overlay to Dur--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="20" id="lnk6"><path d="M433.69,428.0969 C421.37,358.7569 397.8147,226.1298 385.4947,156.7898" fill="none" id="Overlay-to-Dur" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="384.62,151.8669,382.2561,161.4278,385.4947,156.7898,390.1327,160.0284,384.62,151.8669" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="46.979" x="417.56" y="298.5238">publish</text></g><!--link Dur to Store--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk7"><path d="M334.03,151.8469 C303.45,181.6169 266.1916,217.918 235.6716,247.648" fill="none" id="Dur-to-Store" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="232.09,251.1369,241.328,247.7222,235.6716,247.648,235.7458,241.9916,232.09,251.1369" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="102.2798" x="278.52" y="217.4238">persist &#183; fault-in</text></g><!--link Store to Overlay--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="dependency" data-source-line="22" id="lnk8"><path d="M195.27,336.9969 C200.32,357.9669 209.5,382.2569 226.16,398.5469 C238.04,410.1769 247.4709,417.5038 262.2609,425.6538" fill="none" id="Store-to-Overlay" style="stroke:#37474F;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#37474F" points="266.64,428.0669,260.688,420.22,262.2609,425.6538,256.8271,427.2266,266.64,428.0669" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="162.646" x="239.4237" y="379.6138">reopen &#8594; rebuild overlay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="187.1733" x="227.16" y="394.7466">(dense image + WAL replay)</text></g></g></svg>