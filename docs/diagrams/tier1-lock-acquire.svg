<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="597px" preserveAspectRatio="none" style="width:1006px;height:597px;background:#FDFDFD;" version="1.1" viewBox="0 0 1006 597" width="1006px" zoomAndPan="magnify"><defs/><g><rect fill="#FDFDFD" height="597" style="stroke:none;stroke-width:1;" width="1006" x="0" y="0"/><g class="title" data-source-line="15"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="550.9219" x="226.7591" y="32.9951">Tier-1 &#8212; acquire_exclusive_lock (once per OPEN, never per operation)</text></g><ellipse cx="359.9225" cy="62.2969" fill="#5F6368" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="344.2578" x="187.7936" y="92.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="324.2578" x="197.7936" y="113.4355">DiskManager::{create|open|open_without_validation}</text><rect fill="#E8F0FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="327.0898" x="196.3776" y="146.2656"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="149.9004" x="206.3776" y="167.4043">key &#8592; canonicalize(path)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="307.0898" x="206.3776" y="181.373">(parent dir + filename if the file does not exist yet)</text><rect fill="none" height="373.4458" style="stroke:#000000;stroke-width:1.5;" width="970.4401" x="16" y="204.2031"/><path d="M365.9785,204.2031 L365.9785,213.5 L355.9785,223.5 L16,223.5" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="339.9785" x="19" y="218.1982">process-global lock registry (Mutex&lt;HashMap&gt;)</text><path d="M457.9996,233.5 L457.9996,349.4297 L976.4401,349.4297 L976.4401,243.5 L966.4401,233.5 L457.9996,233.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M966.4401,233.5 L966.4401,243.5 L976.4401,243.5 L966.4401,233.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="459.1895" x="463.9996" y="250.5669">The returned guard is stored in the DiskManager for its whole lifetime.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="497.4404" x="463.9996" y="265.6997">Dropping the LAST guard for a path removes the registry entry, which drops</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="455.2285" x="463.9996" y="280.8325">the `.wlock` File and releases the OS `flock`. A `mem::forget` leaks a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="476.4805" x="463.9996" y="295.9653">refcount, so the lock stays held until the process exits &#8212; exactly a crash.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="463.9996" y="311.0981">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="481.5903" x="463.9996" y="326.231">This runs ONCE per open. The lock-free CAS write path and wait-free read</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="495.0791" x="463.9996" y="341.3638">path take NO lock &#8212; the single-process non-blocking invariant is preserved.</text><polygon fill="#FEF7E0" points="273.8453,349.4297,445.9996,349.4297,457.9996,362.2344,445.9996,375.0391,273.8453,375.0391,261.8453,362.2344,273.8453,349.4297" style="stroke:#E0C060;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="115.8545" x="273.8453" y="359.6401">key already present?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="172.1543" x="273.8453" y="372.4448">(same process already owns it)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="242.837" y="359.6401">yes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="457.9996" y="359.6401">no</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="113.709" x="105.3057" y="385.0391"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="93.709" x="115.3057" y="406.1777">entry.refs += 1</text><rect fill="#CEEAD6" height="61.9063" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="268.3203" x="28" y="442.1021"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="117.2285" x="38" y="463.2407">return WLockGuard</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="248.3203" x="38" y="477.2095">(SHARES the existing flock &#8212; e.g. reopen</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="220.9629" x="38" y="491.1782">or a crash-sim mem::forget'd owner)</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="197.3281" x="459.0208" y="385.0391"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="177.3281" x="469.0208" y="406.1777">open "&lt;path&gt;.wlock" sidecar</text><polygon fill="#FEF7E0" points="484.6943,443.7114,630.6753,443.7114,642.6753,455.7114,630.6753,467.7114,484.6943,467.7114,472.6943,455.7114,484.6943,443.7114" style="stroke:#E0C060;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="145.981" x="484.6943" y="459.5195">flock(LOCK_EX | LOCK_NB)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="86.3618" x="316.3203" y="440.3125">EWOULDBLOCK</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="156.374" x="316.3203" y="453.1172">&#8212; another PROCESS holds it</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="15.0283" x="642.6753" y="453.1172">Ok</text><rect fill="#F6AEA9" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="205.3145" x="331.2786" y="477.7114"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="185.3145" x="341.2786" y="498.8501">return Err(FileLocked { path })</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="249.6816" x="556.593" y="477.7114"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="229.6816" x="566.593" y="498.8501">registry.insert(key &#8594; { file, refs = 1 })</text><rect fill="#CEEAD6" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="207.4707" x="577.6985" y="531.6802"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="187.4707" x="587.6985" y="552.8188">return WLockGuard (new flock)</text><line style="stroke:#5F6368;stroke-width:1;" x1="359.9225" x2="359.9225" y1="72.2969" y2="92.2969"/><polygon fill="#5F6368" points="355.9225,82.2969,359.9225,92.2969,363.9225,82.2969,359.9225,86.2969" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="359.9225" x2="359.9225" y1="126.2656" y2="146.2656"/><polygon fill="#5F6368" points="355.9225,136.2656,359.9225,146.2656,363.9225,136.2656,359.9225,140.2656" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="162.1602" x2="162.1602" y1="419.0078" y2="442.1021"/><polygon fill="#5F6368" points="158.1602,432.1021,162.1602,442.1021,166.1602,432.1021,162.1602,436.1021" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="681.4338" x2="681.4338" y1="511.6802" y2="531.6802"/><polygon fill="#5F6368" points="677.4338,521.6802,681.4338,531.6802,685.4338,521.6802,681.4338,525.6802" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="472.6943" x2="433.9358" y1="455.7114" y2="455.7114"/><line style="stroke:#5F6368;stroke-width:1;" x1="433.9358" x2="433.9358" y1="455.7114" y2="477.7114"/><polygon fill="#5F6368" points="429.9358,467.7114,433.9358,477.7114,437.9358,467.7114,433.9358,471.7114" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="642.6753" x2="681.4338" y1="455.7114" y2="455.7114"/><line style="stroke:#5F6368;stroke-width:1;" x1="681.4338" x2="681.4338" y1="455.7114" y2="477.7114"/><polygon fill="#5F6368" points="677.4338,467.7114,681.4338,477.7114,685.4338,467.7114,681.4338,471.7114" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="557.6848" x2="557.6848" y1="419.0078" y2="443.7114"/><polygon fill="#5F6368" points="553.6848,433.7114,557.6848,443.7114,561.6848,433.7114,557.6848,437.7114" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="261.8453" x2="162.1602" y1="362.2344" y2="362.2344"/><line style="stroke:#5F6368;stroke-width:1;" x1="162.1602" x2="162.1602" y1="362.2344" y2="385.0391"/><polygon fill="#5F6368" points="158.1602,375.0391,162.1602,385.0391,166.1602,375.0391,162.1602,379.0391" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="457.9996" x2="557.6848" y1="362.2344" y2="362.2344"/><line style="stroke:#5F6368;stroke-width:1;" x1="557.6848" x2="557.6848" y1="362.2344" y2="385.0391"/><polygon fill="#5F6368" points="553.6848,375.0391,557.6848,385.0391,561.6848,375.0391,557.6848,379.0391" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="359.9225" x2="359.9225" y1="194.2031" y2="349.4297"/><polygon fill="#5F6368" points="355.9225,339.4297,359.9225,349.4297,363.9225,339.4297,359.9225,343.4297" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></svg>