<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="597px" preserveAspectRatio="none" style="width:1016px;height:597px;background:#FDFDFD;" version="1.1" viewBox="0 0 1016 597" width="1016px" zoomAndPan="magnify"><defs/><g><rect fill="#FDFDFD" height="597" style="stroke:none;stroke-width:1;" width="1016" x="0" y="0"/><g class="title" data-source-line="15"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="550.9219" x="231.7642" y="32.9951">Tier-1 &#8212; acquire_exclusive_lock (once per OPEN, never per operation)</text></g><ellipse cx="369.9326" cy="62.2969" fill="#5F6368" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="344.2578" x="197.8037" y="92.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="324.2578" x="207.8037" y="113.4355">DiskManager::{create|open|open_without_validation}</text><rect fill="#E8F0FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="327.0898" x="206.3877" y="146.2656"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="149.9004" x="216.3877" y="167.4043">key &#8592; canonicalize(path)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="307.0898" x="216.3877" y="181.373">(parent dir + filename if the file does not exist yet)</text><rect fill="none" height="373.4458" style="stroke:#000000;stroke-width:1.5;" width="980.4502" x="16" y="204.2031"/><path d="M365.9785,204.2031 L365.9785,213.5 L355.9785,223.5 L16,223.5" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="339.9785" x="19" y="218.1982">process-global lock registry (Mutex&lt;HashMap&gt;)</text><path d="M468.0098,233.5 L468.0098,349.4297 L986.4502,349.4297 L986.4502,243.5 L976.4502,233.5 L468.0098,233.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M976.4502,233.5 L976.4502,243.5 L986.4502,243.5 L976.4502,233.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="459.1895" x="474.0098" y="250.5669">The returned guard is stored in the DiskManager for its whole lifetime.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="497.4404" x="474.0098" y="265.6997">Dropping the LAST guard for a path removes the registry entry, which drops</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="497.0723" x="474.0098" y="280.8325">the `.wlock` File and releases the OS advisory lock. A `mem::forget` leaks a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="476.4805" x="474.0098" y="295.9653">refcount, so the lock stays held until the process exits &#8212; exactly a crash.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="474.0098" y="311.0981">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="481.5903" x="474.0098" y="326.231">This runs ONCE per open. The lock-free CAS write path and wait-free read</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="495.0791" x="474.0098" y="341.3638">path take NO lock &#8212; the single-process non-blocking invariant is preserved.</text><polygon fill="#FEF7E0" points="283.8555,349.4297,456.0098,349.4297,468.0098,362.2344,456.0098,375.0391,283.8555,375.0391,271.8555,362.2344,283.8555,349.4297" style="stroke:#E0C060;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="115.8545" x="283.8555" y="359.6401">key already present?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="172.1543" x="283.8555" y="372.4448">(same process already owns it)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="252.8472" y="359.6401">yes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="468.0098" y="359.6401">no</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="113.709" x="113.6318" y="385.0391"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="93.709" x="123.6318" y="406.1777">entry.refs += 1</text><rect fill="#CEEAD6" height="61.9063" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="284.9727" x="28" y="442.1021"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="117.2285" x="38" y="463.2407">return WLockGuard</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="264.9727" x="38" y="477.2095">(SHARES the existing OS lock &#8212; e.g. reopen</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="220.9629" x="38" y="491.1782">or a crash-sim mem::forget'd owner)</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="197.3281" x="470.7148" y="385.0391"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="177.3281" x="480.7148" y="406.1777">open "&lt;path&gt;.wlock" sidecar</text><polygon fill="#FEF7E0" points="530.2532,443.7114,608.5046,443.7114,620.5046,455.7114,608.5046,467.7114,530.2532,467.7114,518.2532,455.7114,530.2532,443.7114" style="stroke:#E0C060;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="78.2515" x="530.2532" y="459.5195">File::try_lock()</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="64.3672" x="361.8792" y="440.3125">WouldBlock</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="156.374" x="361.8792" y="453.1172">&#8212; another PROCESS holds it</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="15.0283" x="620.5046" y="453.1172">Ok</text><rect fill="#F6AEA9" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="205.3145" x="342.9727" y="477.7114"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="185.3145" x="352.9727" y="498.8501">return Err(FileLocked { path })</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="249.6816" x="568.2871" y="477.7114"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="229.6816" x="578.2871" y="498.8501">registry.insert(key &#8594; { file, refs = 1 })</text><rect fill="#CEEAD6" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="224.123" x="581.0664" y="531.6802"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="204.123" x="591.0664" y="552.8188">return WLockGuard (new OS lock)</text><line style="stroke:#5F6368;stroke-width:1;" x1="369.9326" x2="369.9326" y1="72.2969" y2="92.2969"/><polygon fill="#5F6368" points="365.9326,82.2969,369.9326,92.2969,373.9326,82.2969,369.9326,86.2969" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="369.9326" x2="369.9326" y1="126.2656" y2="146.2656"/><polygon fill="#5F6368" points="365.9326,136.2656,369.9326,146.2656,373.9326,136.2656,369.9326,140.2656" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="170.4863" x2="170.4863" y1="419.0078" y2="442.1021"/><polygon fill="#5F6368" points="166.4863,432.1021,170.4863,442.1021,174.4863,432.1021,170.4863,436.1021" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="693.1279" x2="693.1279" y1="511.6802" y2="531.6802"/><polygon fill="#5F6368" points="689.1279,521.6802,693.1279,531.6802,697.1279,521.6802,693.1279,525.6802" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="518.2532" x2="445.6299" y1="455.7114" y2="455.7114"/><line style="stroke:#5F6368;stroke-width:1;" x1="445.6299" x2="445.6299" y1="455.7114" y2="477.7114"/><polygon fill="#5F6368" points="441.6299,467.7114,445.6299,477.7114,449.6299,467.7114,445.6299,471.7114" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="620.5046" x2="693.1279" y1="455.7114" y2="455.7114"/><line style="stroke:#5F6368;stroke-width:1;" x1="693.1279" x2="693.1279" y1="455.7114" y2="477.7114"/><polygon fill="#5F6368" points="689.1279,467.7114,693.1279,477.7114,697.1279,467.7114,693.1279,471.7114" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="569.3789" x2="569.3789" y1="419.0078" y2="443.7114"/><polygon fill="#5F6368" points="565.3789,433.7114,569.3789,443.7114,573.3789,433.7114,569.3789,437.7114" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="271.8555" x2="170.4863" y1="362.2344" y2="362.2344"/><line style="stroke:#5F6368;stroke-width:1;" x1="170.4863" x2="170.4863" y1="362.2344" y2="385.0391"/><polygon fill="#5F6368" points="166.4863,375.0391,170.4863,385.0391,174.4863,375.0391,170.4863,379.0391" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="468.0098" x2="569.3789" y1="362.2344" y2="362.2344"/><line style="stroke:#5F6368;stroke-width:1;" x1="569.3789" x2="569.3789" y1="362.2344" y2="385.0391"/><polygon fill="#5F6368" points="565.3789,375.0391,569.3789,385.0391,573.3789,375.0391,569.3789,379.0391" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="369.9326" x2="369.9326" y1="194.2031" y2="349.4297"/><polygon fill="#5F6368" points="365.9326,339.4297,369.9326,349.4297,373.9326,339.4297,369.9326,343.4297" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></svg>