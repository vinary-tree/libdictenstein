<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="644px" preserveAspectRatio="none" style="width:1006px;height:644px;background:#FDFDFD;" version="1.1" viewBox="0 0 1006 644" width="1006px" zoomAndPan="magnify"><defs/><g><rect fill="#FDFDFD" height="644" style="stroke:none;stroke-width:1;" width="1006" x="0" y="0"/><g class="title" data-source-line="15"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="550.9219" x="226.7591" y="32.9951">Tier-1 &#8212; acquire_exclusive_lock (once per OPEN, never per operation)</text></g><rect fill="#FFFFCC" height="42.24" rx="2.5" ry="2.5" style="stroke:#FFDD88;stroke-width:3;" width="975.4401" x="13" y="50.2969"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="62.9169">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#CEEAD6&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="86.5368">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#F6AEA9&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><ellipse cx="359.9225" cy="109.5368" fill="#5F6368" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="344.2578" x="187.7936" y="139.5368"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="324.2578" x="197.7936" y="160.6755">DiskManager::{create|open|open_without_validation}</text><rect fill="#E8F0FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="327.0898" x="196.3776" y="193.5056"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="149.9004" x="206.3776" y="214.6443">key &#8592; canonicalize(path)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="307.0898" x="206.3776" y="228.613">(parent dir + filename if the file does not exist yet)</text><rect fill="none" height="373.4458" style="stroke:#000000;stroke-width:1.5;" width="970.4401" x="16" y="251.4431"/><path d="M365.9785,251.4431 L365.9785,260.74 L355.9785,270.74 L16,270.74" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="339.9785" x="19" y="265.4382">process-global lock registry (Mutex&lt;HashMap&gt;)</text><path d="M457.9996,280.74 L457.9996,396.6697 L976.4401,396.6697 L976.4401,290.74 L966.4401,280.74 L457.9996,280.74" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M966.4401,280.74 L966.4401,290.74 L976.4401,290.74 L966.4401,280.74" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="459.1895" x="463.9996" y="297.8069">The returned guard is stored in the DiskManager for its whole lifetime.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="497.4404" x="463.9996" y="312.9397">Dropping the LAST guard for a path removes the registry entry, which drops</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="455.2285" x="463.9996" y="328.0725">the `.wlock` File and releases the OS `flock`. A `mem::forget` leaks a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="476.4805" x="463.9996" y="343.2053">refcount, so the lock stays held until the process exits &#8212; exactly a crash.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="463.9996" y="358.3381">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="481.5903" x="463.9996" y="373.4709">This runs ONCE per open. The lock-free CAS write path and wait-free read</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="495.0791" x="463.9996" y="388.6037">path take NO lock &#8212; the single-process non-blocking invariant is preserved.</text><polygon fill="#FEF7E0" points="273.8453,396.6697,445.9996,396.6697,457.9996,409.4743,445.9996,422.279,273.8453,422.279,261.8453,409.4743,273.8453,396.6697" style="stroke:#E0C060;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="115.8545" x="273.8453" y="406.8801">key already present?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="172.1543" x="273.8453" y="419.6848">(same process already owns it)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="242.837" y="406.8801">yes</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="457.9996" y="406.8801">no</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="113.709" x="105.3057" y="432.279"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="93.709" x="115.3057" y="453.4177">entry.refs += 1</text><rect fill="#E8F0FE" height="61.9063" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="268.3203" x="28" y="489.342"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="117.2285" x="38" y="510.4807">return WLockGuard</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="248.3203" x="38" y="524.4494">(SHARES the existing flock &#8212; e.g. reopen</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="220.9629" x="38" y="538.4182">or a crash-sim mem::forget'd owner)</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="197.3281" x="459.0208" y="432.279"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="177.3281" x="469.0208" y="453.4177">open "&lt;path&gt;.wlock" sidecar</text><polygon fill="#FEF7E0" points="484.6943,490.9514,630.6753,490.9514,642.6753,502.9514,630.6753,514.9514,484.6943,514.9514,472.6943,502.9514,484.6943,490.9514" style="stroke:#E0C060;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="145.981" x="484.6943" y="506.7595">flock(LOCK_EX | LOCK_NB)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="86.3618" x="316.3203" y="487.5525">EWOULDBLOCK</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="156.374" x="316.3203" y="500.3572">&#8212; another PROCESS holds it</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="15.0283" x="642.6753" y="500.3572">Ok</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="205.3145" x="331.2786" y="524.9514"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="185.3145" x="341.2786" y="546.0901">return Err(FileLocked { path })</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="249.6816" x="556.593" y="524.9514"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="229.6816" x="566.593" y="546.0901">registry.insert(key &#8594; { file, refs = 1 })</text><rect fill="#E8F0FE" height="33.9688" rx="12.5" ry="12.5" style="stroke:#5F6368;stroke-width:0.5;" width="207.4707" x="577.6985" y="578.9202"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="187.4707" x="587.6985" y="600.0588">return WLockGuard (new flock)</text><line style="stroke:#5F6368;stroke-width:1;" x1="359.9225" x2="359.9225" y1="119.5368" y2="139.5368"/><polygon fill="#5F6368" points="355.9225,129.5368,359.9225,139.5368,363.9225,129.5368,359.9225,133.5368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="359.9225" x2="359.9225" y1="173.5056" y2="193.5056"/><polygon fill="#5F6368" points="355.9225,183.5056,359.9225,193.5056,363.9225,183.5056,359.9225,187.5056" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="162.1602" x2="162.1602" y1="466.2478" y2="489.342"/><polygon fill="#5F6368" points="158.1602,479.342,162.1602,489.342,166.1602,479.342,162.1602,483.342" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="681.4338" x2="681.4338" y1="558.9202" y2="578.9202"/><polygon fill="#5F6368" points="677.4338,568.9202,681.4338,578.9202,685.4338,568.9202,681.4338,572.9202" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="472.6943" x2="433.9358" y1="502.9514" y2="502.9514"/><line style="stroke:#5F6368;stroke-width:1;" x1="433.9358" x2="433.9358" y1="502.9514" y2="524.9514"/><polygon fill="#5F6368" points="429.9358,514.9514,433.9358,524.9514,437.9358,514.9514,433.9358,518.9514" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="642.6753" x2="681.4338" y1="502.9514" y2="502.9514"/><line style="stroke:#5F6368;stroke-width:1;" x1="681.4338" x2="681.4338" y1="502.9514" y2="524.9514"/><polygon fill="#5F6368" points="677.4338,514.9514,681.4338,524.9514,685.4338,514.9514,681.4338,518.9514" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="557.6848" x2="557.6848" y1="466.2478" y2="490.9514"/><polygon fill="#5F6368" points="553.6848,480.9514,557.6848,490.9514,561.6848,480.9514,557.6848,484.9514" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="261.8453" x2="162.1602" y1="409.4743" y2="409.4743"/><line style="stroke:#5F6368;stroke-width:1;" x1="162.1602" x2="162.1602" y1="409.4743" y2="432.279"/><polygon fill="#5F6368" points="158.1602,422.279,162.1602,432.279,166.1602,422.279,162.1602,426.279" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="457.9996" x2="557.6848" y1="409.4743" y2="409.4743"/><line style="stroke:#5F6368;stroke-width:1;" x1="557.6848" x2="557.6848" y1="409.4743" y2="432.279"/><polygon fill="#5F6368" points="553.6848,422.279,557.6848,432.279,561.6848,422.279,557.6848,426.279" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#5F6368;stroke-width:1;" x1="359.9225" x2="359.9225" y1="241.4431" y2="396.6697"/><polygon fill="#5F6368" points="355.9225,386.6697,359.9225,396.6697,363.9225,386.6697,359.9225,390.6697" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></svg>