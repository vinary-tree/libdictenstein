625.5775,474.6228,629.5775,464.6228,625.5775,468.6228" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="625.5775" x2="625.5775" y1="522.5603" y2="542.5603"/><polygon fill="#37474F" points="621.5775,532.5603,625.5775,542.5603,629.5775,532.5603,625.5775,536.5603" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="66"><rect fill="none" height="79.1875" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="185.8271" x="1694.7505" y="585.5603"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="36.5518" x="1704.2007" y="605.5554">Color</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="63.8955" x="1749.6528" y="605.5554">Outcome</text><rect fill="#FFE0B2" height="16.2969" style="stroke:none;stroke-width:1;" width="45.4521" x="1699.7505" y="608.8572"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1699.7505" y="621.8523">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="111.5557" x="1749.6528" y="621.8523">regime decision</text><rect fill="#C8E6C9" height="16.2969" style="stroke:none;stroke-width:1;" width="45.4521" x="1699.7505" y="625.154"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1699.7505" y="638.1492">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="121.4746" x="1749.6528" y="638.1492">KEEP (recovered)</text><rect fill="#FFCDD2" height="16.2969" style="stroke:none;stroke-width:1;" width="45.4521" x="1699.7505" y="641.4509"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1699.7505" y="654.446">&#160;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="104.877" x="1749.6528" y="654.446">DROP (orphan)</text><line style="stroke:#000000;stroke-width:1;" x1="1699.7505" x2="1875.5776" y1="592.5603" y2="592.5603"/><line style="stroke:#000000;stroke-width:1;" x1="1699.7505" x2="1875.5776" y1="608.8572" y2="608.8572"/><line style="stroke:#000000;stroke-width:1;" x1="1699.7505" x2="1875.5776" y1="625.154" y2="625.154"/><line style="stroke:#000000;stroke-width:1;" x1="1699.7505" x2="1875.5776" y1="641.4509" y2="641.4509"/><line style="stroke:#000000;stroke-width:1;" x1="1699.7505" x2="1875.5776" y1="657.7478" y2="657.7478"/><line style="stroke:#000000;stroke-width:1;" x1="1699.7505" x2="1699.7505" y1="592.5603" y2="657.7478"/><line style="stroke:#000000;stroke-width:1;" x1="1745.2026" x2="1745.2026" y1="592.5603" y2="657.7478"/><line style="stroke:#000000;stroke-width:1;" x1="1875.5776" x2="1875.5776" y1="592.5603" y2="657.7478"/></g></g></svg>