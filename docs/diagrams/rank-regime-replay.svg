<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="688px" preserveAspectRatio="none" style="width:1904px;height:688px;background:#FFFFFF;" version="1.1" viewBox="0 0 1904 688" width="1904px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="26"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="737.8164" x="582.3806" y="32.9951">RankRegime replay drop-rule &#8212; applied per record, generation_of(lsn) = rank.unwrap_or(lsn)</text></g><rect fill="#FFFFCC" height="42.24" rx="2.5" ry="2.5" style="stroke:#FFDD88;stroke-width:3;" width="1873.5776" x="13" y="50.2969"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="62.9169">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#C8E6C9&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="86.5368">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#FFCDD2&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><ellipse cx="625.5775" cy="109.5368" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="200.75" x="525.2025" y="139.5368"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="180.75" x="535.2025" y="160.6755">read next durable WAL record</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="72.9902" x="535.2025" y="174.6443">(lsn, record)</text><polygon fill="#FFE0B2" points="560.1146,207.4743,691.0404,207.4743,703.0404,220.279,691.0404,233.0837,560.1146,233.0837,548.1146,220.279,560.1146,207.4743" style="stroke:#F9A825;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="130.9258" x="560.1146" y="217.6848">does this record carry a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="42.0234" x="560.1146" y="230.4895">durable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="78.6221" x="605.6346" y="230.4895">CommitRank</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="5.8384" x="684.2567" y="230.4895">?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="83.0317" x="465.0829" y="217.6848">yes &#8212; RANKED</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="94.0049" x="703.0404" y="217.6848">no &#8212; UNRANKED</text><path d="M351.1777,243.0837 L351.1777,274.3493 L331.1777,278.3493 L351.1777,282.3493 L351.1777,313.615 A0,0 0 0 0 351.1777,313.615 L709.8984,313.615 A0,0 0 0 0 709.8984,313.615 L709.8984,253.0837 L699.8984,243.0837 L351.1777,243.0837 A0,0 0 0 0 351.1777,243.0837" fill="#C8E6C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M699.8984,243.0837 L699.8984,253.0837 L709.8984,253.0837 L699.8984,243.0837" fill="#C8E6C9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="298.9365" x="357.1777" y="260.1506">A ranked record is KEPT regardless of regime.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="316.1069" x="357.1777" y="275.2834">Recovery stamps generation_of(lsn) = rank, and</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="310.7368" x="357.1777" y="290.4162">reconciles per term by MAX (generation, lsn) so</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="337.7207" x="357.1777" y="305.5491">LSN-ordered replay == CAS-order committed state.</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="315.1777" x="16" y="247.3962"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="34.4883" x="26" y="268.5349">KEEP</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="256.875" x="64.3027" y="268.5349">(generation = its CommitRank generation)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="269.5898" x="26" y="282.5036">the op committed: its visibility CAS won AND</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="259.4824" x="26" y="296.4724">the rank was durably bound before the ack</text><polygon fill="#FFE0B2" points="999.1348,243.0837,1155.9976,243.0837,1167.9976,255.8884,1155.9976,268.6931,999.1348,268.6931,987.1348,255.8884,999.1348,243.0837" style="stroke:#F9A825;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="38.7524" x="999.1348" y="253.2942">header</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="76.9463" x="1041.3838" y="253.2942">rank_regime</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="34.1709" x="1121.8267" y="253.2942">of this</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="74.5454" x="999.1348" y="266.0989">file/segment?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="61.585" x="925.5498" y="253.2942">Owned = 0</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="65.9731" x="1167.9976" y="253.2942">Overlay = 1</text><path d="M892.2578,278.6931 L892.2578,317.5251 L872.2578,321.5251 L892.2578,325.5251 L892.2578,364.3572 A0,0 0 0 0 892.2578,364.3572 L1206.3228,364.3572 A0,0 0 0 0 1206.3228,364.3572 L1206.3228,288.6931 L1196.3228,278.6931 L892.2578,278.6931 A0,0 0 0 0 892.2578,278.6931" fill="#C8E6C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M1196.3228,278.6931 L1196.3228,288.6931 L1206.3228,288.6931 L1196.3228,278.6931" fill="#C8E6C9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="263.0024" x="898.2578" y="295.76">Owned / legacy / base / vocab producer:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="293.0649" x="898.2578" y="310.8928">NO record is ever ranked, so every unranked</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="251.3672" x="898.2578" y="326.0256">record is a confirmed in-order append.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="289.4849" x="898.2578" y="341.1584">generation_of(lsn) = lsn &#8594; stable LSN replay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="232.5718" x="898.2578" y="356.2912">(byte-for-byte the pre-fix behavior).</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="132.3594" x="739.8984" y="297.5564"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="34.4883" x="749.8984" y="318.6951">KEEP</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="74.0566" x="788.2012" y="318.6951">in LSN order</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="109.5" x="749.8984" y="332.6638">(generation = lsn)</text><path d="M1491.7856,278.6931 L1491.7856,332.6579 L1471.7856,336.6579 L1491.7856,340.6579 L1491.7856,394.6228 A0,0 0 0 0 1491.7856,394.6228 L1883.5776,394.6228 A0,0 0 0 0 1883.5776,394.6228 L1883.5776,288.6931 L1873.5776,278.6931 L1491.7856,278.6931 A0,0 0 0 0 1491.7856,278.6931" fill="#FFCDD2" style="stroke:#181818;stroke-width:0.5;"/><path d="M1873.5776,278.6931 L1873.5776,288.6931 L1883.5776,288.6931 L1873.5776,278.6931" fill="#FFCDD2" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="322.1499" x="1497.7856" y="295.76">Overlay producer: every CONFIRMED op carries a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="350.2764" x="1497.7856" y="310.8928">CommitRank. An unranked record is the gap between</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="326.5996" x="1497.7856" y="326.0256">the data append and the (never-written) rank &#8212; a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="329.0879" x="1497.7856" y="341.1584">crash landed in the two-append window, so the op</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="370.792" x="1497.7856" y="356.2912">was NEVER acknowledged. Keeping it would RESURRECT</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="259.9429" x="1497.7856" y="371.4241">a write that no caller ever saw succeed.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="234.8252" x="1497.7856" y="386.5569">THIS IS THE SAFETY-CRITICAL RULE.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="245.4629" x="1226.3228" y="312.6892"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="38.1973" x="1236.3228" y="333.8279">DROP</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="183.4512" x="1278.3345" y="333.8279">&#8212; `continue` (skip the record)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="32.6074" x="1236.3228" y="347.7966">it is a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="132.709" x="1272.7446" y="347.7966">two-append orphan</text><polygon fill="#FFE0B2" points="1077.5662,400.6228,1089.5662,412.6228,1077.5662,424.6228,1065.5662,412.6228,1077.5662,400.6228" style="stroke:#F9A825;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#FFE0B2" points="625.5775,430.6228,637.5775,442.6228,625.5775,454.6228,613.5775,442.6228,625.5775,430.6228" style="stroke:#F9A825;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="297.9277" x="476.6136" y="474.6228"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="263.543" x="486.6136" y="495.7615">emit the kept op (or nothing for a dropped /</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="277.9277" x="486.6136" y="509.7302">no-op record) into the (generation, lsn) merge</text><ellipse cx="625.5775" cy="553.5603" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="625.5775" cy="553.5603" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#37474F;stroke-width:1;" x1="625.5775" x2="625.5775" y1="119.5368" y2="139.5368"/><polygon fill="#37474F" points="621.5775,129.5368,625.5775,139.5368,629.5775,129.5368,625.5775,133.5368" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="987.1348" x2="806.0781" y1="255.8884" y2="255.8884"/><line style="stroke:#37474F;stroke-width:1;" x1="806.0781" x2="806.0781" y1="255.8884" y2="297.5564"/><polygon fill="#37474F" points="802.0781,287.5564,806.0781,297.5564,810.0781,287.5564,806.0781,291.5564" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="1167.9976" x2="1349.0542" y1="255.8884" y2="255.8884"/><line style="stroke:#37474F;stroke-width:1;" x1="1349.0542" x2="1349.0542" y1="255.8884" y2="312.6892"/><polygon fill="#37474F" points="1345.0542,302.6892,1349.0542,312.6892,1353.0542,302.6892,1349.0542,306.6892" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="806.0781" x2="806.0781" y1="345.4939" y2="412.6228"/><line style="stroke:#37474F;stroke-width:1;" x1="806.0781" x2="1065.5662" y1="412.6228" y2="412.6228"/><polygon fill="#37474F" points="1055.5662,408.6228,1065.5662,412.6228,1055.5662,416.6228,1059.5662,412.6228" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="1349.0542" x2="1349.0542" y1="360.6267" y2="412.6228"/><line style="stroke:#37474F;stroke-width:1;" x1="1349.0542" x2="1089.5662" y1="412.6228" y2="412.6228"/><polygon fill="#37474F" points="1099.5662,408.6228,1089.5662,412.6228,1099.5662,416.6228,1095.5662,412.6228" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="s