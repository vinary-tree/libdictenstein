ext></g><!--entity R6--><g class="entity" data-qualified-name="R6" data-source-line="30" id="ent0007"><rect fill="#FFE0B2" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="361.8242" x="45.61" y="623.2509"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="97.207" x="55.61" y="646.2461">num_entries</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="240.167" x="157.2672" y="646.2461">: u16 &#8212; number of nodes / entries</text></g><!--entity R7--><g class="entity" data-qualified-name="R7" data-source-line="31" id="ent0008"><rect fill="#FFE0B2" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="296.9443" x="78.05" y="719.5409"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="85.3057" x="88.05" y="742.5361">free_offset</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="187.1885" x="177.8059" y="742.5361">: u16 &#8212; start of free space</text></g><!--entity R8--><g class="entity" data-qualified-name="R8" data-source-line="32" id="ent0009"><rect fill="#BBDEFB" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="372.1875" x="40.43" y="815.8409"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="84.5947" x="50.43" y="838.8361">prev_block</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="263.1426" x="139.4749" y="838.8361">: u32 &#8212; previous block in chain (or 0)</text></g><!--entity R9--><g class="entity" data-qualified-name="R9" data-source-line="33" id="ent0010"><rect fill="#BBDEFB" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="342.9229" x="55.06" y="912.1409"/><text fill="