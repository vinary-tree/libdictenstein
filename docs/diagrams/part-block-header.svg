<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1126px" preserveAspectRatio="none" style="width:460px;height:1126px;background:#FFFFFF;" version="1.1" viewBox="0 0 460 1126" width="460px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="22"><text fill="#000000" font-family="'DejaVu Sans'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="210.4541" x="121.2944" y="23.9233">Block Header &#8212; 64 bytes</text></g><!--entity R0--><g class="entity" data-qualified-name="R0" data-source-line="24" id="ent0001"><rect fill="#C8E6C9" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="287.333" x="82.85" y="45.4609"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="47.1543" x="92.85" y="68.4561">magic</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="215.7285" x="144.4545" y="68.4561">: u32 &#8212; identifies a valid block</text></g><!--entity R1--><g class="entity" data-qualified-name="R1" data-source-line="25" id="ent0002"><rect fill="#C8E6C9" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="244.1299" x="104.46" y="141.7609"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="58.2422" x="114.46" y="164.7561">version</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="161.4375" x="177.1524" y="164.7561">: u16 &#8212; format version</text></g><!--entity R2--><g class="entity" data-qualified-name="R2" data-source-line="26" id="ent0003"><rect fill="#C8E6C9" height="36.2969" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="439.043" x="7" y="238.0609"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight=