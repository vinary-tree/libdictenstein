ated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#FFE0B2&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><ellipse cx="213.7646" cy="173.0737" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="274.7363" x="76.3965" y="203.0737"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="176.0449" x="86.3965" y="224.2124">open_with_recovery(path)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="254.7363" x="86.3965" y="238.1811">read VocabTrieFileHeader (magic "VOCB")</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="216.3945" x="105.5674" y="319.4135"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="69.8672" x="115.5674" y="340.5522">fail-closed</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="117.3281" x="189.249" y="340.5522">&#8212; legacy v1 owned</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="169.5879" x="115.5674" y="354.521">format is no longer loadable</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="196.3945" x="115.5674" y="368.4897">(rebuild with the overlay format)</text><polygon fill="#FFE0B2" points="128.3643,271.0112,299.165,271.0112,311.165,283.0112,299.165,295.0112,128.3643,295.0112,116.3643,283.0112,128.3643,271.0112" style="stroke:#F9A825;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="217.7646" y="305.2216">no</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="170.8008" x="128.3643" y="286.8193">version == V2 overlay format?</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="11" lengthAdjust="spacing" textLength="153.3931" x="311.165" y="280.417">yes &#8212; durable forward path</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="318.043" x="54.7432" y="423.3198"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="43.9395" x="64.7432" y="444.4585">decode</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="54.3867" x="112.4971" y="444.4585">root_ptr</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="3.8145" x="166.8838" y="444.4585">,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="99.9141" x="174.5127" y="444.4585">checkpoint_lsn</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="3.8145" x="274.4268" y="444.4585">,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="80.3379" x="64.7432" y="458.4272">entry_count</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="3.8145" x="145.0811" y="458.4272">,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="108.4746" x="152.71" y="458.4272">start/next index</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="97.7871" x="264.999" y="458.4272">from the header</text><rect fill="none" height="263.7773" style="stroke:#000000;stroke-width:1.5;" width="738.9419" x="16" y="481.2573"/><path d="M382.46,481.2573 L382.46,490.5542 L372.46,500.5542 L16,500.5542" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="356.46" x="19" y="495.2524">FORWARD overlay  (durable &#8212; the source of truth)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="347.1641" x="40.1826" y="517.5542"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="282.5156" x="50.1826" y="538.6928">reestablish_overlay_from_image(root_ptr)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="279.1348" x="50.1826" y="552.6616">load the dense char-overlay checkpoint image</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="327.1641" x="50.1826" y="566.6303">into the lock-free overlay (value at each leaf = u64 id)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="375.5293" x="26" y="599.4604"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="355.5293" x="36" y="620.5991">replay_wal_into_overlay_rank_aware(checkpoint_lsn)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="291.8672" x="36" y="634.5678">fold the durable WAL tail (LSN &gt; checkpoint_lsn)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="262.1719" x="36" y="648.5366">rank-aware, stopping at the first torn frame</text><path d="M384.1963,677.6362 L384.1963,701.3354 L364.1963,705.3354 L384.1963,709.3354 L384.1963,733.0346 A0,0 0 0 0 384.1963,733.0346 L744.9419,733.0346 A0,0 0 0 0 744.9419,733.0346 L744.9419,687.6362 L734.9419,677.6362 L384.1963,677.6362 A0,0 0 0 0 384.1963,677.6362" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><path d="M734.9419,677.6362 L734.9419,687.6362 L744.9419,687.6362 L734.9419,677.6362" fill="#ECEFF1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="304.5796" x="390.1963" y="694.7031">Only the FORWARD direction is written to disk.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="311.6382" x="390.1963" y="709.8359">The image stores term &#8594; id; the WAL stores the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="339.7456" x="390.1963" y="724.9687">durable insert tail. Nothing on disk stores id &#8594; term.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="300.8633" x="63.333" y="681.3667"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="280.8633" x="73.333" y="702.5053">forward map ready &#8212; `get_index(term)` walks</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="154.2305" x="73.333" y="716.4741">the overlay in `O(|term|)`</text><rect fill="none" height="246.0781" style="stroke:#000000;stroke-width:1.5;" width="389.5234" x="19.0029" y="755.0346"/><path d="M388.2793,755.0346 L388.2793,764.3315 L378.2793,774.3315 L19.0029,774.3315" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="359.2764" x="22.0029" y="769.0298">REVERSE map  (derived &#8212; rebuilt, never persisted)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="369.5234" x="29.0029" y="791.3315"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="349.5234" x="39.0029" y="812.4702">allocate the `reverse_term_map: DashMap&lt;u64, String&gt;`</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="143.0332" x="39.0029" y="826.4389">(non-blocking, sharded)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="258.8516" x="84.3389" y="859.269"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="238.8516" x="94.3389" y="880.4077">scan the recovered forward entries</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="222.457" x="94.3389" y="894.3764">for each (term, id) leaf in the overlay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="221.291" x="94.3389" y="908.3452">&#8594; reverse_term_map.insert(id, term)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="301.1563" x="63.1865" y="941.1753"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="281.1563" x="73.1865" y="962.3139">reverse map ready &#8212; `get_term(id)` is now an</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="275.8652" x="73.1865" y="976.2827">`O(1)` sharded lookup into the rebuilt inverse</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="327.9453" x="49.792" y="1021.1128"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="104.8301" x="59.792" y="1042.2514">resume serving</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="261.2754" x="59.792" y="1056.2202">forward + reverse lookups both answer the</text><text fill="#000000" font-family="'DejaVu Sans'" font-siz