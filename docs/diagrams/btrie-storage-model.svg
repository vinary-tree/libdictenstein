<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="521px" preserveAspectRatio="none" style="width:523px;height:521px;background:#FFFFFF;" version="1.1" viewBox="0 0 523 521" width="523px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="20"><text fill="#000000" font-family="'DejaVu Sans'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="195.0293" x="160.9512" y="23.9233">B-trie &#8212; storage model</text></g><!--cluster BT--><g class="cluster" data-qualified-name="BT" data-source-line="22" id="ent0001"><rect fill="#F5F5F5" height="410.27" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="386" x="65.4658" y="45.4609"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="44.3721" x="236.2798" y="60.4561">B-trie</text></g><!--entity TN--><g class="entity" data-qualified-name="BT.TN" data-source-line="23" id="ent0002"><rect fill="#BBDEFB" height="85.1875" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="331.3564" x="92.7858" y="80.4609"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="84.8066" x="102.7858" y="103.4561">Trie Nodes</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="118.877" x="196.4929" y="103.4561">(512 bytes each)</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="263.6348" x="102.7858" y="119.7529">128 pointers, one per ASCII character</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="249.3682" x="102.7858" y="136.0498">each pointer &#8594; trie node OR bucket</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="311.3564" x="102.7858" y="152.3467">many pointers may share one hybrid bucket</text></g><!--entity BK--><g class="entity" data-qualified-name="BT.BK" data-source-line="24" id="ent0003"><rect fill="#C8E6C9" height="85.1875" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="316.6797" x="100.1258" y="225.6509"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="62.7676" x="110.1258" y="248.6461">Buckets</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="81.2793" x="181.7938" y="248.6461">(8 KB each)</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="275.8643" x="110.1258" y="264.9429">header: range [l, u] &#183; count &#183; free space</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="296.6797" x="110.1258" y="281.2398">sorted string-pointer array (binary search)</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="265.7949" x="110.1258" y="297.5367">string data area (occurrence-ordered)</text></g><!--entity HT--><g class="entity" data-qualified-name="BT.HT" data-source-line="25" id="ent0004"><rect fill="#FFE0B2" height="68.8906" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.2;" width="354.749" x="81.0958" y="370.8409"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="87.6504" x="91.0958" y="393.8361">Hash Table</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="135.2969" x="187.6466" y="393.8361">(consumed strings)</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="298.7441" x="91.0958" y="410.1329">strings entirely consumed by trie traversal</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="334.749" x="91.0958" y="426.4298">e.g. 'c' consumed by the root trie &#8594; stored here</text></g><!--link TN to BK--><!--link BK to HT--><g class="legend" data-source-line="31"><rect fill="none" height="26.2969" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="492.9316" x="12" y="475.7309"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="482.9316" x="17" y="493.7261">blue index nodes &#183; green leaf buckets &#183; amber consumed-string hash</text></g></g></svg>