<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1321px" preserveAspectRatio="none" style="width:763px;height:1321px;background:#FFFFFF;" version="1.1" viewBox="0 0 763 1321" width="763px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="28"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="731.165" x="12.5146" y="22.9951">Checkpoint flip &#8212; capture live overlay -&gt; publish dense CX image -&gt; advance checkpoint_lsn</text></g><g class="entity" data-qualified-name="Serving" data-source-line="32" id="ent0001"><path d="M172.19,124.2969 L560.2994,124.2969 A12.5,12.5 0 0 1 572.7994,136.7969 L572.7994,150.5938 L159.69,150.5938 L159.69,136.7969 A12.5,12.5 0 0 1 172.19,124.2969" fill="#C8E6C9"/><path d="M159.69,150.5938 L572.7994,150.5938 L572.7994,286.9844 A12.5,12.5 0 0 1 560.2994,299.4844 L172.19,299.4844 A12.5,12.5 0 0 1 159.69,286.9844 L159.69,150.5938" fill="#C8E6C9"/><rect fill="none" height="175.1875" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="413.1094" x="159.69" y="124.2969"/><line style="stroke:#37474F;stroke-width:0.5;" x1="159.69" x2="572.7994" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="155.627" x="288.4312" y="142.292">Serving (steady state)</text><g class="entity" data-qualified-name="Serving.LiveOverlay" data-source-line="34" id="ent0002"><rect fill="#F1F1F1" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="377.1094" x="171.69" y="217.5938"/><line style="stroke:#37474F;stroke-width:0.5;" x1="171.69" x2="548.7994" y1="243.8906" y2="243.8906"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="83.0156" x="318.7369" y="235.5889">LiveOverlay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="234.7598" x="176.69" y="261.8857">reads traverse the published root</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="357.1094" x="176.69" y="278.1826">writes = Order-A (WAL append+fsync -&gt; root CAS)</text></g><g class="start_entity" data-qualified-name="Serving..start.Serving" data-source-line="33" id="ent0011"><ellipse cx="360.24" cy="171.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><!--link *start*Serving to LiveOverlay--><g class="link" data-entity-1="ent0011" data-entity-2="ent0002" data-link-type="dependency" data-source-line="33" id="lnk12"><path d="M360.24,181.9038 C360.24,190.6638 360.24,199.3438 360.24,212.2238" fill="none" id="*start*Serving-to-LiveOverlay" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="360.24,217.2238,364.24,208.2238,360.24,212.2238,356.24,208.2238,360.24,217.2238" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g><g class="entity" data-qualified-name="AcquireLock" data-source-line="39" id="ent0003"><rect fill="#FFF59D" height="68.8906" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="436.4453" x="8.02" y="376.4769"/><line style="stroke:#37474F;stroke-width:0.5;" x1="8.02" x2="444.4653" y1="402.7738" y2="402.7738"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="201.4756" x="125.5049" y="394.472">Acquire checkpoint lock (CK)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="234.2471" x="13.02" y="420.7689">serializes concurrent checkpoints</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="416.4453" x="13.02" y="437.0657">read committed watermark (Acquire) BEFORE the root load</text></g><g class="entity" data-qualified-name="Capture" data-source-l