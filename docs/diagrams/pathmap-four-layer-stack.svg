<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="547px" preserveAspectRatio="none" style="width:488px;height:547px;background:#FFFFFF;" version="1.1" viewBox="0 0 488 547" width="488px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="19"><text fill="#000000" font-family="'DejaVu Sans'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="461.521" x="10" y="23.9233">Three integration layers over shared PathMap storage</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" data-source-line="21" id="ent0001"><rect fill="#C8E6C9" height="85.1875" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.1;" width="420.2031" x="30.6631" y="45.4609"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="245.7178" x="40.6631" y="68.4561">Layer 3 &#8212; MeTTa Query Syntax</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="336.8682" x="40.6631" y="84.7529">!(match &amp;space (fuzzy-phonetic &#8220;fone&#8221; 2 $r) $r)</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="265.8564" x="40.6631" y="101.0498">!(match &amp;space (fuzzy &#8220;colr&#8221; 2 $r) $r)</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="400.2031" x="40.6631" y="117.3467">user-facing query language (phonetic-aware + standard)</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" data-source-line="22" id="ent0002"><rect fill="#FFE0B2" height="85.1875" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:1.1;" width="457.0488" x="12.2331" y="190.6509"/><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="391.043" x="22.2331" y="213.6461">Layer 2 &#8212; MORK Fuzzy(