<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="664px" preserveAspectRatio="none" style="width:907px;height:664px;background:#FFFFFF;" version="1.1" viewBox="0 0 907 664" width="907px" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="32"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="660.9326" x="119.6974" y="22.9951">Refinement tower &#8212; the persistent ART refines an abstract Map ADT (Rocq-proved)</text></g><!--entity MapSpec--><g class="entity" data-qualified-name="MapSpec" data-source-line="35" id="ent0001"><rect fill="#C8E6C9" height="85.1875" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:0.5;" width="318.1084" x="191.77" y="461.2669"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="160.125" x="201.77" y="484.262">&#9312; Abstract MapSpec</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="101.2539" x="370.7954" y="484.262">(the Map ADT)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="298.1084" x="201.77" y="500.5589">Spec/MapSpec.v &#8212; keys &#8640; values with the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="272.4941" x="201.77" y="516.8557">lookup / insert / delete equational laws</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="280.4512" x="201.77" y="533.1526">(lookup_empty, insert_lookup_same, &#8230;)</text></g><!--entity Refine--><g class="entity" data-qualified-name="Refine" data-source-line="38" id="ent0002"><rect fill="#C8E6C9" height="117.7813" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:0.5;" width="407.6865" x="146.98" y="44.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="152.7422" x="156.98" y="67.292">&#9313; Refinement layer</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="330.7637" x="156.98" y="83.5889">Spec/ARTrieSpec.v &#8212; interpret_trie, trie_insert,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="248.4248" x="156.98" y="99.8857">trie_delete + correctness theorems</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="278.4893" x="156.98" y="116.1826">(trie_insert_correct, trie_delete_correct)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="278.8994" x="156.98" y="132.4795">Proofs/MapRefinement.v &#8212; WFARTrie +</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="145.3867" x="156.98" y="148.7764">WFARTrieMapImpl</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="237.8496" x="306.8169" y="148.7764">instance (3 Qed-closed theorems)</text></g><!--entity Impl--><g class="entity" data-qualified-name="Impl" data-source-line="41" id="ent0003"><rect fill="#ECEFF1" height="85.1875" rx="2.5" ry="2.5" style="stroke:#37474F;stroke-width:0.5;" width="411.6445" x="7" y="269.0769"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="209.3574" x="17" y="292.072">&#9314; Concrete Persistent ART</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="42.3076" x="235.2578" y="292.072">(Rust)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="259.0957" x="17" y="308.3689">src/persistent_artrie{,_char,_vocab}/</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="391.6445" x="17" y="324.6657">Node4/16/48/256 &#183; path compression &#183; lock-free overlay</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="272.7266" x="17" y="340.9626">&#183; WAL &#183; arena &#8212; the artifact callers run</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="51" id="ent0008"><path d="M589.32,52.7969 L589.32,99.1869 L554.96,103.1869 L589.32,107.1869 L589.32,153.5938 A0,0 0 0 0 589.32,153.5938 L892.3273,153.5938 A0,0 0 0 0 892.3273,153.5938 L892.3273,62.7969 L882.3273,52.7969 L589.32,52.7969 A0,0 0 0 0 589.32,52.7969" fill="#FFE0B2" style="stroke:#181818;stroke-width:0.5;"/><path d="M882.3273,52.7969 L882.3273,62.7969 L892.3273,62.7969 L882.3273,52.7969" fill="#FFE0B2" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="114.5942" x="595.32" y="69.8638">The refinement is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="51.2446" x="714.0466" y="69.8638">proved</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="96.7319" x="765.2912" y="69.8638">, not assumed:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="282.0073" x="595.32" y="84.9966">WFARTrieMapImpl discharges the Map-ADT</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="263.3135" x="595.32" y="100.1294">obligations via canonical_lookup_correct</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="277.3164" x="595.32" y="115.2622">plus the upsert/delete map laws under the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="238.7607" x="595.32" y="130.395">entries_of_trie_complete hypothesis.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="220.1304" x="595.32" y="145.5278">No Admitted / Axiom / Parameter.</text></g><!--link MapSpec to Refine--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="44" id="lnk4"><path d="M441.33,460.7869 C451.51,452.4269 460.48,442.6369 466.82,431.2669 C518.62,338.4369 514.13,287.2769 466.82,192.0769 C461.43,181.2169 457.4338,174.9527 448.8938,166.0627" fill="none" id="MapSpec-to-Refine" style="stroke:#EF6C00;stroke-width:1;"/><polygon fill="#EF6C00" points="445.43,162.4569,448.7803,171.7184,448.8938,166.0627,454.5496,166.1762,445.43,162.4569" style="stroke:#EF6C00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="91.7427" x="554.7978" y="301.2438">is refined by</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="178.5659" x="511.3862" y="316.3766">(every concrete behavior is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="191.3184" x="505.01" y="331.5094">a behavior MapSpec permits)</text></g><!--link Refine to Impl--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="45" id="lnk5"><path d="M269.23,162.4869 C260.07,171.5969 251.61,181.5269 244.82,192.0769 C230.07,215.0469 222.957,239.7762 218.647,263.6862" fill="none" id="Refine-to-Impl" style="stroke:#EF6C00;stroke-width:1;"/><polygon fill="#EF6C00" points="217.76,268.6069,223.2932,260.4592,218.647,263.6862,215.42,259.04,217.76,268.6069" style="stroke:#EF6C00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="135.5605" x="286.499" y="205.1438">is implemented by</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="216.9185" x="245.82" y="220.2766">(interpret_trie maps the concrete</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="176.7568" x="265.9008" y="235.4094">trie onto the abstract map)</text></g><!--link Impl to MapSpec--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="dependency" data-source-line="48" id="lnk6"><path d="M216.39,354.7669 C220.16,378.9669 227.91,408.8969 243.82,431.2669 C251.73,442.3769 258.0068,449.1698 268.9768,457.7798" fill="none" id="Impl-to-MapSpec" style="stroke:#2E7D32;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#2E7D32" points="272.91,460.8669,268.2999,452.1636,268.9768,457.7798,263.3606,458.4568,272.91,460.8669" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="151.0996" x="278.1388" y="397.3338">refines / implements</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="217.7373" x="244.82" y="412.4666">(witnessed by WFARTrieMapImpl,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="154.686" x="276.3456" y="427.5994">machine-checked Qed.)</text></g><g class="legend" data-source-line="59"><rect fill="none" height="79.1875" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="418.6318" x="469.6955" y="566.4544"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="36.5518" x="479.1457" y="586.4495">Color</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="39.0332" x="524.5978" y="586.4495">Layer<