"'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="51.0371" x="189.4219" y="260.4561">full key</text><text fill="#212121" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="147.4785" x="244.9092" y="260.4561">verified at the leaf</text></g><!--link R0 to R1--><!--link R1 to R2--><g class="legend" data-source-line="29"><rect fill="none" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="557.791" x="12" y="293.7578"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="547.791" x="17" y="311.7529">Skips the prefix comparison during traversal &#8212; unlimited compression length,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="374.7939" x="17" y="328.0498">at the cost of a full-key check when a leaf is reached.</text></g></g></svg>