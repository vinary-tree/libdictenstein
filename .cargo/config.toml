# Cargo configuration for libdictenstein.
#
# We enable the minimum CPU features required by transitive dependencies
# (PathMap's gxhash needs AES plus SSE2 on x86 or NEON on ARM) — NOT
# `target-cpu=native`. The native setting silently invokes AVX2 / AVX-512 /
# etc. on whatever host the build runs on, producing binaries that emit
# illegal-instruction signals when run on slightly older hardware.
#
# To rebuild with `target-cpu=native` for local development (release/bench
# profiles benefit measurably on AVX2+ hardware), set the env var:
#
#     RUSTFLAGS="-C target-cpu=native" cargo bench --features persistent-artrie
#
# RUSTFLAGS in the environment overrides this file.

# Keep architecture features conditional: a global `[build]` rustflags entry
# would incorrectly pass SSE2 to ARM release builders.
[target.'cfg(all(any(target_arch = "x86", target_arch = "x86_64"), any(target_os = "linux", target_os = "macos", target_os = "windows")))']
rustflags = ["-C", "target-feature=+aes,+sse2"]

[target.'cfg(all(any(target_arch = "arm", target_arch = "aarch64"), any(target_os = "linux", target_os = "macos", target_os = "windows")))']
rustflags = ["-C", "target-feature=+aes,+neon"]

# Rust's musl targets default to a static C runtime, which cannot produce the
# cdylib embedded in musllinux Python wheels. Cargo joins these exact-target
# flags with the architecture cfg flags above; the repeated architecture
# features are intentional and `-crt-static` selects musl's dynamic CRT.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes,+sse2,-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes,+neon,-crt-static"]

# Coverage profile for accurate branch coverage with cargo-llvm-cov.
[profile.coverage]
inherits = "dev"
opt-level = 0
debug = true
codegen-units = 1
lto = false
incremental = false
