\* NEGATIVE CONTROL: the exact image-identity guard is dropped. A path-copy
\* write clears liveStamp after image v1 is checkpointed, but unguarded eviction
\* may still publish that old image over acknowledged v2. NoStaleEvict must fail.
\*
\* Only the invariant the unsafe relaxation breaks is asserted (mirrors the
\* OverlayEvictionCas_Unsafe.cfg convention of checking just the firing invariant).
CONSTANTS
    Nodes = {n1, n2}
    USE_EVICTION_GUARD = FALSE
    USE_FAULT_STAMP = TRUE
    MaxVer = 3
    MaxImage = 3
    MaxRoot = 6

SPECIFICATION Spec

CONSTRAINT RootBound

INVARIANT TypeInvariant
INVARIANT NoStaleEvict

CHECK_DEADLOCK FALSE
