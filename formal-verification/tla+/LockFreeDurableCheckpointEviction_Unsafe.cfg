\* NEGATIVE control: reclaiming the appended frontier can discard a record that
\* commits after checkpoint capture. TLC must violate
\* NoLostWriteUnderLockFreeCommit.
CONSTANTS
    Writers = {w1, w2}
    Lsns = {1, 2, 3}
    NoLsn = 0
    Generations = {g1, g2}
    NoGeneration = NoGeneration
    USE_WATERMARK = FALSE
    UnsafeSemanticPreservesBinding = FALSE
    UnsafePublishIgnoresRoot = FALSE
    UnsafePublishBeforeStamp = FALSE
    UnsafeExactUseIgnoresRoot = FALSE
    UnsafeRecoveryUsesDetached = FALSE

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT NoLostWriteUnderLockFreeCommit

CHECK_DEADLOCK FALSE
