CONSTANTS
    Catalogs = {oldCatalog, freshCatalogA, freshCatalogB}
    RootIds = {oldRoot, freshRootA, freshRootB}
    Words = {word0, word1, word2}
    OldCatalog = oldCatalog
    FreshCatalogA = freshCatalogA
    FreshCatalogB = freshCatalogB
    OldRoot = oldRoot
    FreshRootA = freshRootA
    FreshRootB = freshRootB
    DistinguishedWord = word0
    PartialWord = word2
    MaxOrdinal = 2
    UnsafeReuseOrdinal = FALSE
    UnsafeWrongGeneration = TRUE
    UnsafePartialFresh = FALSE
    UnsafeNonExactRoot = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PublishedCellsMatchLogicalRoot
CHECK_DEADLOCK FALSE
