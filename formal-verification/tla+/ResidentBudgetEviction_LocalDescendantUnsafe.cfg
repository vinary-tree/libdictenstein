\* NEGATIVE CONTROL: the historical policy sums local candidate weights and
\* executes deepest-first. At target 2 it selects leaf and middle, plans two
\* units, but leaf replacement makes middle stale; only one unit is reclaimed.
CONSTANTS
    USE_EXACT_CLOSURE = FALSE
    USE_ANCESTOR_EXECUTION = FALSE
    REVALIDATE_SNAPSHOT = TRUE
    TargetBytes = 2
    CandidateCap = 3

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT PlannedReclamationIsReal

CHECK_DEADLOCK FALSE
