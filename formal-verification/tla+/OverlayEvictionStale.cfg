\* Correct exact-provenance design. Eviction requires liveStamp to name the
\* registry's exact durableImage; fault preparation recreates that stamp from
\* the decoded image before a winner CAS can publish its private candidate.
\* Two nodes permit an unrelated root publication to force a fault-CAS loser.
CONSTANTS
    Nodes = {n1, n2}
    USE_EVICTION_GUARD = TRUE
    USE_FAULT_STAMP = TRUE
    MaxVer = 3
    MaxImage = 3
    MaxRoot = 6

SPECIFICATION Spec

CONSTRAINT RootBound

INVARIANT TypeInvariant
INVARIANT NoStaleEvict
INVARIANT LinkedAndOnDiskDisjoint
INVARIANT DurableImagesAreInitialized
INVARIANT OnDiskSlotsNameInitializedImages
INVARIANT LiveStampIsHonest
INVARIANT PathCopiesCarryNoStamp
INVARIANT PrivateFaultCandidateMatchesImage
INVARIANT FaultInstalledCarriesExactStamp

PROPERTY FaultLoserPublishesNothing
PROPERTY FaultWinnerPublishesPrivateCandidate
PROPERTY PathCopyClearsProvenance

CHECK_DEADLOCK FALSE
