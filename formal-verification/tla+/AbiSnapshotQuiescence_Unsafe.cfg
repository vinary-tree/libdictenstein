\* Negative control: without admission closure, a writer can enter whenever
\* the last admitted writer leaves. Capture is enabled only transiently, so
\* weak fairness does not prevent an infinite writer-leave/writer-enter cycle.
\* This configuration MUST violate SnapshotEventuallyCompletes.
SPECIFICATION Spec

CONSTANTS
  MaxWriters = 2
  USE_ADMISSION_GATE = FALSE

PROPERTY SnapshotEventuallyCompletes

CHECK_DEADLOCK FALSE
