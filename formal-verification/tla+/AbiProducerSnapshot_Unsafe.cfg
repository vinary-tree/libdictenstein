\* Negative control: snapshots alias the live head instead of pinning the
\* captured revision (the rejected design). MUST violate
\* CapturedRevisionImmutable — a post-capture publish rewrites what an ABI
\* consumer already captured.
SPECIFICATION Spec

CONSTANTS
  Terms = {t1, t2, t3}
  MaxPublishes = 4
  MaxCaptures = 2
  USE_IMMUTABLE_CAPTURE = FALSE

INVARIANTS
  CapturedRevisionImmutable

CHECK_DEADLOCK FALSE
