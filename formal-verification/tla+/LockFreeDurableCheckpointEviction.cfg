\* Safe composition: committed-watermark WAL reclamation, stamped exact-root
\* catalog publication, exact-use authorization, and recovery independent of
\* detached advisory state.
CONSTANTS
    Writers = {w1, w2}
    Lsns = {1, 2, 3}
    NoLsn = 0
    Generations = {g1, g2}
    NoGeneration = NoGeneration
    USE_WATERMARK = TRUE
    UnsafeSemanticPreservesBinding = FALSE
    UnsafePublishIgnoresRoot = FALSE
    UnsafePublishBeforeStamp = FALSE
    UnsafeExactUseIgnoresRoot = FALSE
    UnsafeRecoveryUsesDetached = FALSE

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT DurablePrefix
INVARIANT RootRevisionTracksCommitted
INVARIANT ImmutableSnapshotIsClosed
INVARIANT CaptureEqualsPublishFrontier
INVARIANT NoLostWriteUnderLockFreeCommit
INVARIANT RecoveredNeverInventsState
INVARIANT ExactRootRegistryAgreement
INVARIANT PublishedCatalogIsStamped
INVARIANT RegistryPointsAtDurableWatermark
INVARIANT NoInexactUse
INVARIANT RecoveryIndependentOfDetached

CHECK_DEADLOCK FALSE
