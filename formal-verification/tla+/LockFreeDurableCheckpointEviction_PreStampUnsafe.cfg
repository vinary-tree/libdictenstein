\* NEGATIVE control: exact publication before the candidate catalog is stamped
\* must violate the stamped-publication invariant.
CONSTANTS
    Writers = {w1, w2}
    Lsns = {1, 2, 3}
    NoLsn = 0
    Generations = {g1, g2}
    NoGeneration = NoGeneration
    USE_WATERMARK = TRUE
    UnsafeSemanticPreservesBinding = FALSE
    UnsafePublishIgnoresRoot = FALSE
    UnsafePublishBeforeStamp = TRUE
    UnsafeExactUseIgnoresRoot = FALSE
    UnsafeRecoveryUsesDetached = FALSE

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT PublishedCatalogIsStamped

CHECK_DEADLOCK FALSE
