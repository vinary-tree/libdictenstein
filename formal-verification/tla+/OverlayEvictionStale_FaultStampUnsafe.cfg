\* NEGATIVE CONTROL: exact fault decoding publishes the right value bytes but
\* omits the source-image stamp. The winner is resident yet cannot prove the
\* provenance required by a subsequent exact re-eviction.
CONSTANTS
    Nodes = {n1}
    USE_EVICTION_GUARD = TRUE
    USE_FAULT_STAMP = FALSE
    MaxVer = 2
    MaxImage = 2
    MaxRoot = 6

SPECIFICATION Spec

CONSTRAINT RootBound

INVARIANT TypeInvariant
INVARIANT FaultInstalledCarriesExactStamp

CHECK_DEADLOCK FALSE
