# cargo-deny configuration for libdictenstein.
#
# Nothing in this repository previously checked the dependency tree for published
# advisories. A manual OSV sweep in 2026-07 found five in the locked tree, three of
# them live soundness bugs (memmap2 unchecked pointer offset, crossbeam-epoch invalid
# pointer dereference, anyhow Error::downcast_mut). All were silently present for
# months. This gate exists so that never depends on someone thinking to look.
#
# Run locally with:
#     cargo deny check
# CI runs `check advisories bans sources licenses` on every push and on a schedule --
# the schedule matters because advisories are published against code that has not
# changed, so a push-only gate goes stale without any commit to blame.

[graph]
# Check every feature combination's dependencies, not just the default set. The
# persistent-artrie stack (memmap2, sysinfo, lru, dashmap, rustix) is optional, and
# that is exactly where the mmap soundness advisory lived.
all-features = true

# ---------------------------------------------------------------------------
# Published security advisories (RustSec).
# ---------------------------------------------------------------------------
[advisories]
yanked = "deny"

# Every entry here MUST carry a reason that states WHY the risk is accepted and a
# REVIEW-BY date. An advisory with no fixed version is a standing risk to
# re-evaluate, not something to mute permanently.
#
# This list is currently EMPTY, and should stay that way. The tree has zero
# advisories: the last one (RUSTSEC-2025-0141, bincode unmaintained) was closed by
# migrating to the maintained `bincode-next` fork rather than by suppressing it.
ignore = []

# ---------------------------------------------------------------------------
# Licence compatibility. This crate ships Apache-2.0.
# ---------------------------------------------------------------------------
[licenses]
# All permissive and Apache-2.0-compatible. Anything outside this set is a
# deliberate decision that has to be made here, in review, rather than arriving
# silently with a transitive dependency.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # xxhash-rust (node deduplication in the persistent ARTrie, and via pathmap).
  # OSI approved and FSF Free/Libre.
  "BSL-1.0",
]
confidence-threshold = 0.9

# Several entries above are pre-approved rather than currently present. Warning on
# each of those on every run would train people to ignore this gate's output, which
# is the opposite of what it is for.
unused-allowed-license = "allow"

# ---------------------------------------------------------------------------
# Duplicate versions and banned crates.
# ---------------------------------------------------------------------------
[bans]
# "deny", with every currently-unavoidable duplicate enumerated below.
#
# This is deliberately stricter than a bare "warn". Each duplicate that remains is
# pinned inside an upstream crate and cannot be resolved from this manifest -- but
# listing them individually means a *new* duplicate, or one that becomes resolvable
# because an upstream released a fix, fails the gate instead of blending into a wall
# of warnings. Re-check the list whenever these dependencies move; an entry that
# stops matching is a duplicate that has been fixed upstream and should be deleted.
#
# The 2026-07 upgrade already collapsed rand / rand_core / rand_chacha / ppv-lite86
# to one copy each and retired the stale itertools 0.10 that criterion 0.5 pulled.
multiple-versions = "deny"
wildcards = "deny"

skip = [
  # dashmap 6.2.1 (its latest) pins hashbrown 0.14; petgraph 0.8 pins 0.15;
  # indexmap 2.14 and lru 0.18 are on 0.17. Three unrelated upstreams, no overlap.
  { crate = "hashbrown:0.14.5", reason = "pinned by dashmap 6.2.1, its latest release" },
  { crate = "hashbrown:0.15.5", reason = "pinned by petgraph 0.8.3, reached via prost-build" },
  # foldhash tracks whichever hashbrown pulled it, so it duplicates for the same reason.
  { crate = "foldhash:0.1.5", reason = "pulled by hashbrown 0.15.5; resolves when that does" },
  # NOTE: getrandom (0.3 via rand_core, 0.4 via tempfile) and itertools (0.13 via
  # criterion, 0.14 via prost-build) also duplicate in the full graph, but need no
  # entry here -- their second copy arrives only through a dev-dependency, which
  # cargo-deny excludes from this check. Adding skips for them would be flagged as
  # unmatched configuration.
  # syn 2 lingers in proc-macro crates that have not moved to 3 yet.
  { crate = "syn:2.0.119", reason = "pinned by pathmap-derive, prettyplease and prost-build" },
]

deny = [
  # The abandoned crate itself, at any version. We use `bincode-next`, the
  # maintained fork, declared under the name `bincode` via a package rename --
  # so this ban catches a transitive dependency dragging the real one back in.
  { crate = "bincode", reason = "unmaintained (RUSTSEC-2025-0141); 3.0.0 is a tombstone containing only a compiler error. Use the maintained `bincode-next` fork." },
  # Unmaintained, archived, and superseded by `pastey` (RUSTSEC-2024-0436).
  { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436); use `pastey`, declared here via a package rename" },
]

# ---------------------------------------------------------------------------
# Where crates may come from.
# ---------------------------------------------------------------------------
# This is the check that makes adopting a third-party fork of an abandoned crate an
# explicit, reviewable decision rather than an invisible one -- directly relevant
# here, since `bincode-next` is exactly such a fork (Apich-Organization, not the
# original bincode-org).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
